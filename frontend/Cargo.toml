[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-storage = "0.3"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator"] }
serde_json = "1"
# Without the `server` feature: no hidden tests or solutions in the browser.
content = { path = "../crates/content" }
shared = { path = "../crates/shared" }

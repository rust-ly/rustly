[package]
name = "runner"
version = "0.1.0"
edition = "2024"
publish = false

# Server-only: the frontend never depends on this crate.
[dependencies]
shared = { path = "../shared" }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

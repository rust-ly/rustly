id = "tokio.spawning.challenge"
kind = "challenge"
title = "Fan out, fan in"
prompt = '''
A `Server` is shared by many tasks through an `Arc`. Each `lookup` takes `LATENCY`
(100 ms), counts itself in `calls` (an atomic, so tasks can bump it from any
thread), and **panics** on the key `"boom"`, like a buggy request handler.

Write `async fn lookup_all(server: Arc<Server>, keys: Vec<String>) -> Vec<Option<String>>`:

- Look up every key **concurrently**, one spawned task per key, so a whole batch
  takes 100 ms.
- Return the answers in the same order as `keys`. A key the server doesn't know is `None`.
- If a lookup's task **panics**, that key's answer is `None`, and every other key
  still gets its answer. `lookup_all` itself must not panic.

The grader runs with Tokio's clock paused, so it can check the timing exactly.
'''
starter = '''
use std::collections::HashMap;
use std::sync::Arc;
use std::sync::atomic::{AtomicUsize, Ordering};
use std::time::Duration;
use tokio::time::sleep;

const LATENCY: Duration = Duration::from_millis(100);

struct Server {
    data: HashMap<String, String>,
    calls: AtomicUsize,
}

impl Server {
    fn new() -> Self {
        let data = [("hello", "world"), ("crab", "ferris"), ("runtime", "tokio")]
            .into_iter()
            .map(|(k, v)| (k.to_string(), v.to_string()))
            .collect();
        Server { data, calls: AtomicUsize::new(0) }
    }

    async fn lookup(&self, key: &str) -> Option<String> {
        self.calls.fetch_add(1, Ordering::SeqCst);
        sleep(LATENCY).await;
        if key == "boom" {
            panic!("the handler for {key:?} crashed");
        }
        self.data.get(key).cloned()
    }
}

async fn lookup_all(server: Arc<Server>, keys: Vec<String>) -> Vec<Option<String>> {
    todo!()
}

#[tokio::main]
async fn main() {
    let server = Arc::new(Server::new());
    let keys = ["hello", "boom", "crab", "nope"].map(String::from).to_vec();
    println!("{:?}", lookup_all(server, keys).await);
}
'''

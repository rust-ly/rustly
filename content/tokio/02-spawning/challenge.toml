hints = [
  "Each task needs its own `Arc<Server>` and its own `String` key: clone the `Arc` and use `async move`.",
  "Spawn every task first and keep the `JoinHandle`s; await them afterwards, so the lookups overlap.",
  "`handle.await` is `Err` when the task panicked. `handle.await.unwrap_or(None)` turns that into `None`.",
]
solution = '''
use std::collections::HashMap;
use std::sync::Arc;
use std::sync::atomic::{AtomicUsize, Ordering};
use std::time::Duration;
use tokio::time::sleep;

const LATENCY: Duration = Duration::from_millis(100);

struct Server {
    data: HashMap<String, String>,
    calls: AtomicUsize,
}

impl Server {
    fn new() -> Self {
        let data = [("hello", "world"), ("crab", "ferris"), ("runtime", "tokio")]
            .into_iter()
            .map(|(k, v)| (k.to_string(), v.to_string()))
            .collect();
        Server { data, calls: AtomicUsize::new(0) }
    }

    async fn lookup(&self, key: &str) -> Option<String> {
        self.calls.fetch_add(1, Ordering::SeqCst);
        sleep(LATENCY).await;
        if key == "boom" {
            panic!("the handler for {key:?} crashed");
        }
        self.data.get(key).cloned()
    }
}

async fn lookup_all(server: Arc<Server>, keys: Vec<String>) -> Vec<Option<String>> {
    let handles: Vec<_> = keys
        .into_iter()
        .map(|key| {
            let server = Arc::clone(&server);
            tokio::spawn(async move { server.lookup(&key).await })
        })
        .collect();
    let mut answers = Vec::new();
    for handle in handles {
        answers.push(handle.await.unwrap_or(None));
    }
    answers
}

#[tokio::main]
async fn main() {
    let server = Arc::new(Server::new());
    let keys = ["hello", "boom", "crab", "nope"].map(String::from).to_vec();
    println!("{:?}", lookup_all(server, keys).await);
}
'''

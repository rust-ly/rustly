        let words = Arc::new(vec!["x".to_string(); 4]);
        lengths(Arc::clone(&words)).await;
        assert_eq!(Arc::strong_count(&words), 1);
    }
}
'''
hints = [
  "Each task needs its own owned handle to the data: clone the `Arc` inside the loop.",
  "Then make the block `async move`, so the task takes its clone (and `i`) with it.",
  "`let words = Arc::clone(&words); handles.push(tokio::spawn(async move { words[i].len() }));`",
]
solution = '''
use std::sync::Arc;

async fn lengths(words: Arc<Vec<String>>) -> Vec<usize> {
    let mut handles = Vec::new();
    for i in 0..words.len() {
        let words = Arc::clone(&words);
        handles.push(tokio::spawn(async move {
            words[i].len()
        }));
    }
    let mut out = Vec::new();
    for handle in handles {
        out.push(handle.await.unwrap());
    }
    out
}

#[tokio::main]
async fn main() {
    let words = Arc::new(vec!["hello".to_string(), "tokio".to_string(), "!".to_string()]);
    println!("{:?}", lengths(Arc::clone(&words)).await);
    println!("still have {} words", words.len());
}
'''

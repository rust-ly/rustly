hints = [
  "In `get`, check `self.cache.get(key)` first and return `Some(value.clone())` on a hit.",
  "On a miss: `let answer = self.server.fetch(key).await;` then, if it's `Some`, insert a copy into `self.cache` before returning it.",
  "For `lookup_all`, build the runtime like the first checkpoint, then `block_on(async { ... })` a loop that pushes `cached.get(key).await` into a `Vec`.",
]
solution = '''
use std::collections::HashMap;
use std::time::Duration;
use tokio::time::sleep;

const SLOW: Duration = Duration::from_millis(100);

struct SlowServer {
    data: HashMap<&'static str, &'static str>,
    calls: u32,
}

impl SlowServer {
    fn new() -> Self {
        let data = HashMap::from([("hello", "world"), ("crab", "ferris"), ("runtime", "tokio")]);
        SlowServer { data, calls: 0 }
    }

    async fn fetch(&mut self, key: &str) -> Option<String> {
        self.calls += 1;
        sleep(SLOW).await;
        self.data.get(key).map(|v| v.to_string())
    }
}

struct Cached {
    server: SlowServer,
    cache: HashMap<String, String>,
}

impl Cached {
    fn new(server: SlowServer) -> Self {
        Cached { server, cache: HashMap::new() }
    }

    async fn get(&mut self, key: &str) -> Option<String> {
        if let Some(value) = self.cache.get(key) {
            return Some(value.clone());
        }
        let answer = self.server.fetch(key).await;
        if let Some(value) = &answer {
            self.cache.insert(key.to_string(), value.clone());
        }
        answer
    }
}

fn lookup_all(keys: &[&str]) -> Vec<Option<String>> {
    let runtime = tokio::runtime::Builder::new_current_thread()
        .enable_all()
        .build()
        .unwrap();
    runtime.block_on(async {
        let mut cached = Cached::new(SlowServer::new());
        let mut answers = Vec::new();
        for key in keys {
            answers.push(cached.get(key).await);
        }
        answers
    })
}

fn main() {
    println!("{:?}", lookup_all(&["hello", "crab", "hello", "nope"]));
}
'''

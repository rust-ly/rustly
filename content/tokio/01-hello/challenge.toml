id = "tokio.hello.challenge"
kind = "challenge"
title = "A cache in front of a slow server"
prompt = '''
`SlowServer` answers lookups, but every `fetch` takes `SLOW` (100 ms) and counts
itself in `calls`. Put a cache in front of it:

- `async fn get(&mut self, key: &str) -> Option<String>` on `Cached`: if the key is
  already in `cache`, return it **straight away** (no waiting, no server call).
  Otherwise `fetch` it from the server, and remember the answer only if there was one.
- `fn lookup_all(keys: &[&str]) -> Vec<Option<String>>`: a plain, non-async function.
  It builds its own current-thread Tokio runtime, creates one `Cached` over
  `SlowServer::new()`, and looks up every key in order with that same cache.

The grader checks the answers, how many times the server was called, and (with
Tokio's clock paused) how long each lookup took.
'''

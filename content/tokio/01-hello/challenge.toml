hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    use tokio::time::Instant;

    #[tokio::test(start_paused = true)]
    async fn a_miss_goes_to_the_server() {
        let mut cached = Cached::new(SlowServer::new());
        let start = Instant::now();
        assert_eq!(cached.get("crab").await, Some("ferris".to_string()));
        assert_eq!(start.elapsed(), SLOW);
        assert_eq!(cached.server.calls, 1);
    }

    #[tokio::test(start_paused = true)]
    async fn a_hit_is_instant() {
        let mut cached = Cached::new(SlowServer::new());
        cached.get("hello").await;
        let start = Instant::now();
        assert_eq!(cached.get("hello").await, Some("world".to_string()));
        assert_eq!(start.elapsed(), Duration::ZERO);
        assert_eq!(cached.server.calls, 1);
    }

    #[tokio::test(start_paused = true)]
    async fn unknown_keys_are_not_cached() {
        let mut cached = Cached::new(SlowServer::new());
        assert_eq!(cached.get("nope").await, None);
        assert_eq!(cached.get("nope").await, None);
        assert_eq!(cached.server.calls, 2);
        assert!(cached.cache.is_empty());
    }

    #[test]
    fn lookup_all_shares_one_cache() {
        let start = std::time::Instant::now();
        let got = lookup_all(&["hello", "runtime", "hello", "nope", "runtime"]);
        assert_eq!(
            got,
            vec![
                Some("world".to_string()),
                Some("tokio".to_string()),
                Some("world".to_string()),
                None,
                Some("tokio".to_string()),
            ]
        );
        // Three trips to the server, not five.
        let elapsed = start.elapsed();
        assert!(elapsed >= SLOW * 3, "{elapsed:?}");
        assert!(elapsed < SLOW * 5, "{elapsed:?}");
    }

    #[test]
    fn lookup_all_with_no_keys() {
        assert!(lookup_all(&[]).is_empty());
    }
}

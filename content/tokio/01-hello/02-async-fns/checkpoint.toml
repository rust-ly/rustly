id = "tokio.hello.async-fns.checkpoint"
kind = "checkpoint"
title = "A key-value client"
prompt = '''
Finish the in-memory `Client`. Every call pretends to be a network round trip:
it **first** waits `LATENCY` with `tokio::time::sleep`, then does its work.

- `async fn set(&mut self, key: &str, value: &str)` stores the value, replacing any old one.
- `async fn get(&self, key: &str) -> Option<String>` returns a copy of the value, if there is one.
- `async fn hello_world(client: &mut Client) -> Option<String>` sets `"hello"` to
  `"world"`, then gets `"hello"` back and returns it.

The grader runs with Tokio's clock paused and checks how long each call takes.
'''

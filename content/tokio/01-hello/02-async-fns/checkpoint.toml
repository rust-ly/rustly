hints = [
  "Start each method with `sleep(LATENCY).await;`.",
  "`self.data.insert(key.to_string(), value.to_string());` and `self.data.get(key).cloned()`.",
  "`hello_world` is two awaited calls: `client.set(\"hello\", \"world\").await;` then `client.get(\"hello\").await`.",
]
solution = '''
use std::collections::HashMap;
use std::time::Duration;
use tokio::time::sleep;

const LATENCY: Duration = Duration::from_millis(10);

#[derive(Default)]
struct Client {
    data: HashMap<String, String>,
}

impl Client {
    async fn set(&mut self, key: &str, value: &str) {
        sleep(LATENCY).await;
        self.data.insert(key.to_string(), value.to_string());
    }

    async fn get(&self, key: &str) -> Option<String> {
        sleep(LATENCY).await;
        self.data.get(key).cloned()
    }
}

async fn hello_world(client: &mut Client) -> Option<String> {
    client.set("hello", "world").await;
    client.get("hello").await
}

#[tokio::main]
async fn main() {
    let mut client = Client::default();
    println!("{:?}", hello_world(&mut client).await);
}
'''

hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;
    use tokio::time::Instant;

    #[tokio::test(start_paused = true)]
    async fn set_then_get() {
        let mut client = Client::default();
        client.set("a", "1").await;
        client.set("a", "2").await;
        assert_eq!(client.get("a").await, Some("2".to_string()));
        assert_eq!(client.get("missing").await, None);
    }

    #[tokio::test(start_paused = true)]
    async fn every_call_waits_for_the_network() {
        let mut client = Client::default();
        let start = Instant::now();
        client.set("k", "v").await;
        assert_eq!(start.elapsed(), LATENCY);
        client.get("k").await;
        assert_eq!(start.elapsed(), LATENCY * 2);
    }

    #[tokio::test(start_paused = true)]
    async fn says_hello_world() {
        let mut client = Client::default();
        let start = Instant::now();
        assert_eq!(hello_world(&mut client).await, Some("world".to_string()));
        assert_eq!(start.elapsed(), LATENCY * 2);
        assert_eq!(client.data.get("hello").map(String::as_str), Some("world"));
    }
}

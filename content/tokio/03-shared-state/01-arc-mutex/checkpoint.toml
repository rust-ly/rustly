id = "tokio.shared-state.arc-mutex.checkpoint"
kind = "checkpoint"
title = "Handle commands against a shared Db"
prompt = '''
Each connection task calls `handle(db, command)` on the shared database.

- `fn new_db() -> Db` makes an empty database.
- `async fn handle(db: &Db, command: Command) -> Option<String>`:
  - `Set { key, value }` stores the value and returns the **old** value, if there was one.
  - `Get { key }` returns a copy of the value, if there is one.
  - `Del { key }` removes the key and returns the value it had.

The grader runs many connection tasks at once against one `Db`.
'''
starter = '''

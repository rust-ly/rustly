id = "tokio.shared-state.challenge"
kind = "challenge"
title = "A sharded word counter"
prompt = '''
One mutex for the whole store makes every task queue for the same lock. Build
the tutorial's fix, a **sharded** store: several mutexes, each guarding part of the keys.

- `Store::new(shards: usize)` makes that many empty shards.
- `fn shard(&self, key: &str) -> &Mutex<HashMap<String, u64>>` picks a key's shard:
  hash the key with `std::hash::DefaultHasher`, then take the hash modulo the number
  of shards. The same key must always land in the same shard.
- `fn incr(&self, key: &str) -> u64` adds 1 to the key's count and returns the new
  count. `fn get(&self, key: &str) -> u64` returns the count (0 if it's never been seen).
  Both are plain, non-async methods.
- `async fn count_words(store: Arc<Store>, texts: Vec<String>)` spawns one task per
  text. Each task goes through its text's whitespace-separated words, calling
  `incr` for each word and then `yield_now().await` before the next one.

The grader checks the counts, that every key lives in exactly one shard, that the
keys are spread over more than one shard, and runs the tasks on several threads.
'''

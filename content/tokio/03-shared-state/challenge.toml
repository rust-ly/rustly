hints = [
  "`new`: `(0..shards).map(|_| Mutex::new(HashMap::new())).collect()`.",
  "`shard`: `let mut h = DefaultHasher::new(); key.hash(&mut h); &self.shards[(h.finish() % self.shards.len() as u64) as usize]`.",
  "`count_words`: spawn a task per text with its own `Arc` clone, loop over `text.split_whitespace()`, call `store.incr(word)` then `yield_now().await`, and await every handle at the end. `incr` isn't async, so no guard is ever held across the `.await`.",
]
solution = '''
use std::collections::HashMap;
use std::hash::{DefaultHasher, Hash, Hasher};
use std::sync::{Arc, Mutex};
use tokio::task::yield_now;

struct Store {
    shards: Vec<Mutex<HashMap<String, u64>>>,
}

impl Store {
    fn new(shards: usize) -> Self {
        Store { shards: (0..shards).map(|_| Mutex::new(HashMap::new())).collect() }
    }

    fn shard(&self, key: &str) -> &Mutex<HashMap<String, u64>> {
        let mut hasher = DefaultHasher::new();
        key.hash(&mut hasher);
        &self.shards[(hasher.finish() % self.shards.len() as u64) as usize]
    }

    fn incr(&self, key: &str) -> u64 {
        let mut map = self.shard(key).lock().unwrap();
        let count = map.entry(key.to_string()).or_insert(0);
        *count += 1;
        *count
    }

    fn get(&self, key: &str) -> u64 {
        self.shard(key).lock().unwrap().get(key).copied().unwrap_or(0)
    }
}

async fn count_words(store: Arc<Store>, texts: Vec<String>) {
    let handles: Vec<_> = texts
        .into_iter()
        .map(|text| {
            let store = Arc::clone(&store);
            tokio::spawn(async move {
                for word in text.split_whitespace() {
                    store.incr(word);
                    yield_now().await;
                }
            })
        })
        .collect();
    for handle in handles {
        handle.await.unwrap();
    }
}

#[tokio::main]
async fn main() {
    let store = Arc::new(Store::new(4));
    let texts = vec!["the crab and the runtime".to_string(), "the end".to_string()];
    count_words(Arc::clone(&store), texts).await;
    println!("the: {}, crab: {}", store.get("the"), store.get("crab"));
}
'''

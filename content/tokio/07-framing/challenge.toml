hints = [
  "`read_frame` is the loop from the lesson: try to parse a frame from the buffer, otherwise `read_buf` more, and handle `0`. `write_frame` is `write_u32`, `write_all`, `flush`.",
  "In `serve`, keep a `HashMap<String, String>` and loop with `while let Some(frame) = conn.read_frame().await? { ... }`. The `?` passes the mid-frame error on for you.",
  "`let text = String::from_utf8_lossy(&frame); let mut parts = text.splitn(3, ' ');` then `match (parts.next(), parts.next(), parts.next())` with arms like `(Some(\"SET\"), Some(key), Some(value))` and `(Some(\"GET\"), Some(key), None)`.",
]
solution = '''
use std::collections::HashMap;

use bytes::{Buf, Bytes, BytesMut};
use tokio::io::{self, AsyncReadExt, AsyncWriteExt, DuplexStream};

struct Connection {
    stream: DuplexStream,
    buffer: BytesMut,
}

impl Connection {
    async fn read_frame(&mut self) -> io::Result<Option<Bytes>> {
        loop {
            if self.buffer.len() >= 4 {
                let len = (&self.buffer[..4]).get_u32() as usize;
                if self.buffer.len() >= 4 + len {
                    self.buffer.advance(4);
                    return Ok(Some(self.buffer.split_to(len).freeze()));
                }
            }
            if self.stream.read_buf(&mut self.buffer).await? == 0 {
                return if self.buffer.is_empty() {
                    Ok(None)
                } else {
                    Err(io::Error::new(io::ErrorKind::UnexpectedEof, "closed mid-frame"))
                };
            }
        }
    }

    async fn write_frame(&mut self, payload: &[u8]) -> io::Result<()> {
        self.stream.write_u32(payload.len() as u32).await?;
        self.stream.write_all(payload).await?;
        self.stream.flush().await
    }
}

async fn serve(socket: DuplexStream) -> io::Result<usize> {
    let mut conn = Connection { stream: socket, buffer: BytesMut::new() };
    let mut store: HashMap<String, String> = HashMap::new();
    let mut answered = 0;
    while let Some(frame) = conn.read_frame().await? {
        let text = String::from_utf8_lossy(&frame);
        let mut parts = text.splitn(3, ' ');
        let reply = match (parts.next(), parts.next(), parts.next()) {
            (Some("SET"), Some(key), Some(value)) => {
                store.insert(key.to_string(), value.to_string());
                "OK".to_string()
            }
            (Some("GET"), Some(key), None) => {
                store.get(key).cloned().unwrap_or_else(|| "(nil)".to_string())
            }
            _ => "ERR unknown command".to_string(),
        };
        conn.write_frame(reply.as_bytes()).await?;
        answered += 1;
    }
    Ok(answered)
}

#[tokio::main]
async fn main() -> io::Result<()> {
    let (client, server) = io::duplex(64);
    let server_task = tokio::spawn(serve(server));
    let mut conn = Connection { stream: client, buffer: BytesMut::new() };
    for command in ["SET greeting hello world", "GET greeting", "GET nothing", "PING"] {
        conn.write_frame(command.as_bytes()).await?;
        let reply = conn.read_frame().await?.unwrap();
        println!("{command:?} -> {:?}", String::from_utf8_lossy(&reply));
    }
    drop(conn);
    println!("answered {} frames", server_task.await.unwrap()?);
    Ok(())
}
'''

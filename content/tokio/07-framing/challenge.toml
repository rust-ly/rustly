#[cfg(test)]
mod tests {
    use super::*;

    fn encode(commands: &[&str]) -> Vec<u8> {
        let mut v = Vec::new();
        for c in commands {
            v.extend_from_slice(&(c.len() as u32).to_be_bytes());
            v.extend_from_slice(c.as_bytes());
        }
        v
    }

    fn decode(mut bytes: &[u8]) -> Vec<String> {
        let mut out = Vec::new();
        while bytes.len() >= 4 {
            let len = u32::from_be_bytes(bytes[..4].try_into().unwrap()) as usize;
            out.push(String::from_utf8(bytes[4..4 + len].to_vec()).unwrap());
            bytes = &bytes[4 + len..];
        }
        assert!(bytes.is_empty(), "the server sent half a frame: {bytes:?}");
        out
    }

    async fn talk(bytes: Vec<u8>, capacity: usize) -> (Vec<String>, io::Result<usize>) {
        let (client, server) = io::duplex(capacity);
        let server_task = tokio::spawn(serve(server));
        let (mut rd, mut wr) = io::split(client);
        let sender = tokio::spawn(async move {
            let _ = wr.write_all(&bytes).await;
            let _ = wr.shutdown().await;
            wr
        });
        let mut replies = Vec::new();
        rd.read_to_end(&mut replies).await.unwrap();
        let _wr = sender.await.unwrap();
        (decode(&replies), server_task.await.unwrap())
    }

    #[tokio::test]
    async fn set_get_and_unknown() {
        let (replies, answered) =
            talk(encode(&["SET a 1", "GET a", "GET b", "PING"]), 64).await;
        assert_eq!(replies, ["OK", "1", "(nil)", "ERR unknown command"]);
        assert_eq!(answered.unwrap(), 4);
    }

    #[tokio::test]
    async fn values_can_have_spaces_and_be_replaced() {
        let (replies, _) = talk(
            encode(&["SET greeting hello world", "GET greeting", "SET greeting hi", "GET greeting"]),
            64,
        )
        .await;
        assert_eq!(replies, ["OK", "hello world", "OK", "hi"]);
    }

    #[tokio::test]
    async fn through_a_three_byte_pipe() {
        let commands: Vec<String> = (0..20).map(|i| format!("SET key{i} value number {i}")).collect();
        let mut all: Vec<&str> = commands.iter().map(|s| s.as_str()).collect();
        all.push("GET key7");
        let (replies, answered) = talk(encode(&all), 3).await;
        assert_eq!(replies.len(), 21);
        assert_eq!(replies[20], "value number 7");
        assert_eq!(answered.unwrap(), 21);
    }

    #[tokio::test]
    async fn a_client_that_sends_nothing() {
        let (replies, answered) = talk(Vec::new(), 8).await;
        assert!(replies.is_empty());
        assert_eq!(answered.unwrap(), 0);
    }

    #[tokio::test]
    async fn closing_mid_frame_is_an_error() {
        let mut bytes = encode(&["SET a 1"]);
        bytes.extend_from_slice(&[0, 0, 0, 20, b'G', b'E']);
        let (replies, answered) = talk(bytes, 8).await;
        assert_eq!(replies, ["OK"]);
        assert_eq!(answered.expect_err("half a frame must be an error").kind(), io::ErrorKind::UnexpectedEof);
    }

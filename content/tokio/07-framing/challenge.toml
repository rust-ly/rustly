id = "tokio.framing.challenge"
kind = "challenge"
title = "A tiny framed key-value server"
prompt = '''
Build the in-memory cousin of the Tokio tutorial's mini-Redis:

`async fn serve(socket: DuplexStream) -> io::Result<usize>`

Every message, in both directions, is a length-prefixed frame (a big-endian `u32`
length, then that many bytes of UTF-8 text). For each frame the client sends, reply
with exactly one frame:

| Client sends | Reply |
| --- | --- |
| `SET key value` | `OK`, and remember `value` for `key`. The value may contain spaces. |
| `GET key` | the value stored for `key`, or `(nil)` if there isn't one |
| anything else | `ERR unknown command` |

- When the client closes cleanly, return `Ok` with how many frames you answered.
- When it closes in the middle of a frame, return an `Err` with kind
  `io::ErrorKind::UnexpectedEof`.

The grader sends frames through a pipe that only carries a few bytes at a time.
'''

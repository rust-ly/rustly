#[tokio::main]
async fn main() -> io::Result<()> {
    let (client, server) = io::duplex(64);
    let server_task = tokio::spawn(serve(server));
    let mut conn = Connection { stream: client, buffer: BytesMut::new() };
    for command in ["SET greeting hello world", "GET greeting", "GET nothing", "PING"] {
        conn.write_frame(command.as_bytes()).await?;
        let reply = conn.read_frame().await?.unwrap();
        println!("{command:?} -> {:?}", String::from_utf8_lossy(&reply));
    }
    drop(conn);
    println!("answered {} frames", server_task.await.unwrap()?);
    Ok(())
}

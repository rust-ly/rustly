id = "tokio.framing.frames.checkpoint"
kind = "checkpoint"
title = "Cut one frame off the buffer"
prompt = '''
Write `fn parse_frame(buf: &mut BytesMut) -> Option<Bytes>` for length-prefixed frames
(a big-endian `u32` length, then that many bytes):

- If `buf` starts with a complete frame, remove it from `buf` and return its payload.
- Otherwise, return `None` and leave `buf` **exactly as it was**.

The starter takes the frame without checking that it's all there, so it panics on a
partial frame.
'''
starter = '''
use bytes::{Buf, BufMut, Bytes, BytesMut};

fn parse_frame(buf: &mut BytesMut) -> Option<Bytes> {
    let len = buf.get_u32() as usize;
    Some(buf.split_to(len).freeze())
}

fn main() {
    let mut buf = BytesMut::new();
    buf.put_u32(5);
    buf.put_slice(b"hello");
    buf.put_u32(2);
    buf.put_slice(b"h");
    println!("{:?}", parse_frame(&mut buf));
    println!("{:?}", parse_frame(&mut buf));
    println!("left over: {:?}", &buf[..]);
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn frame(payload: &[u8]) -> Vec<u8> {
        let mut v = (payload.len() as u32).to_be_bytes().to_vec();
        v.extend_from_slice(payload);
        v
    }

    #[test]
    fn takes_one_whole_frame() {
        let mut buf = BytesMut::from(&frame(b"hello")[..]);
        assert_eq!(parse_frame(&mut buf), Some(Bytes::from_static(b"hello")));
        assert!(buf.is_empty());
    }

    #[test]
    fn takes_frames_one_at_a_time() {
        let mut bytes = frame(b"one");
        bytes.extend(frame(b"two"));
        let mut buf = BytesMut::from(&bytes[..]);
        assert_eq!(parse_frame(&mut buf), Some(Bytes::from_static(b"one")));
        assert_eq!(parse_frame(&mut buf), Some(Bytes::from_static(b"two")));
        assert_eq!(parse_frame(&mut buf), None);
    }

    #[test]
    fn waits_for_the_whole_length() {
        let mut buf = BytesMut::from(&[0u8, 0][..]);
        assert_eq!(parse_frame(&mut buf), None);
        assert_eq!(&buf[..], &[0, 0], "the buffer must be left as it was");
    }

    #[test]
    fn waits_for_the_whole_payload() {
        let whole = frame(b"hello");
        let mut buf = BytesMut::from(&whole[..7]);
        assert_eq!(parse_frame(&mut buf), None);
        assert_eq!(&buf[..], &whole[..7], "the buffer must be left as it was");
        buf.extend_from_slice(&whole[7..]);
        assert_eq!(parse_frame(&mut buf), Some(Bytes::from_static(b"hello")));
    }

    #[test]
    fn an_empty_frame_is_a_frame() {
        let mut buf = BytesMut::from(&frame(b"")[..]);
        assert_eq!(parse_frame(&mut buf), Some(Bytes::new()));
        assert!(buf.is_empty());
    }
}
'''
hints = [
  "Check `buf.len() < 4` first. Then peek at the length without removing it: `let len = (&buf[..4]).get_u32() as usize;`",
  "If `buf.len() < 4 + len`, return `None`. Otherwise `buf.advance(4);` and `Some(buf.split_to(len).freeze())`.",
]
solution = '''
use bytes::{Buf, BufMut, Bytes, BytesMut};

fn parse_frame(buf: &mut BytesMut) -> Option<Bytes> {
    if buf.len() < 4 {
        return None;
    }
    let len = (&buf[..4]).get_u32() as usize;
    if buf.len() < 4 + len {
        return None;
    }
    buf.advance(4);
    Some(buf.split_to(len).freeze())
}

fn main() {
    let mut buf = BytesMut::new();
    buf.put_u32(5);
    buf.put_slice(b"hello");
    buf.put_u32(2);
    buf.put_slice(b"h");
    println!("{:?}", parse_frame(&mut buf));
    println!("{:?}", parse_frame(&mut buf));
    println!("left over: {:?}", &buf[..]);
}
'''

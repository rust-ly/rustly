    async fn finishes_when_the_senders_are_gone() {
        let (tx, manager) = spawn_manager();
        incr(&tx, "x").await;
        drop(tx);
        timeout(Duration::from_secs(1), manager)
            .await
            .expect("the manager kept running after every sender was dropped")
            .unwrap();
    }
}

title = "A counter manager"
prompt = '''
Build a manager task that owns a map of counters.

- `fn spawn_manager() -> (mpsc::Sender<Command>, JoinHandle<()>)` spawns the
  manager and returns a sender for commands plus its `JoinHandle`. The manager
  handles commands until every sender is dropped, then finishes.
  - `Incr { key, resp }` adds 1 to `key`'s counter and replies with the new value.
  - `Get { key, resp }` replies with the counter's value (0 if it's never been incremented).
- `async fn incr(tx: &mpsc::Sender<Command>, key: &str) -> u64` and
  `async fn get(tx: &mpsc::Sender<Command>, key: &str) -> u64` are the client side:
  make a `oneshot`, send the command, and await the reply.
'''

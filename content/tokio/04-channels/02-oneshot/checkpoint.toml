    async fn many_clients() {
        let (tx, _manager) = spawn_manager();
        let mut clients = Vec::new();
        for _ in 0..50 {
            let tx = tx.clone();
            clients.push(tokio::spawn(async move {
                for _ in 0..10 {
                    incr(&tx, "hits").await;
                }
            }));
        }
        for client in clients {
            client.await.unwrap();
        }
        assert_eq!(get(&tx, "hits").await, 500);

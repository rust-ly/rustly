hints = [
  "`spawn_manager`: make an `mpsc::channel(32)`, spawn a task that owns the `Receiver` and a `HashMap<String, u64>`, and loop with `while let Some(command) = rx.recv().await`.",
  "In the loop, `match` the command and answer with `let _ = resp.send(value);`.",
  "Client side: `let (resp, answer) = oneshot::channel(); tx.send(Command::Incr { key: key.to_string(), resp }).await.unwrap(); answer.await.unwrap()`.",
]
solution = '''
use std::collections::HashMap;
use tokio::sync::{mpsc, oneshot};
use tokio::task::JoinHandle;

enum Command {
    Incr { key: String, resp: oneshot::Sender<u64> },
    Get { key: String, resp: oneshot::Sender<u64> },
}

fn spawn_manager() -> (mpsc::Sender<Command>, JoinHandle<()>) {
    let (tx, mut rx) = mpsc::channel(32);
    let manager = tokio::spawn(async move {
        let mut counters: HashMap<String, u64> = HashMap::new();
        while let Some(command) = rx.recv().await {
            match command {
                Command::Incr { key, resp } => {
                    let count = counters.entry(key).or_insert(0);
                    *count += 1;
                    let _ = resp.send(*count);
                }
                Command::Get { key, resp } => {
                    let _ = resp.send(counters.get(&key).copied().unwrap_or(0));
                }
            }
        }
    });
    (tx, manager)
}

async fn incr(tx: &mpsc::Sender<Command>, key: &str) -> u64 {
    let (resp, answer) = oneshot::channel();
    tx.send(Command::Incr { key: key.to_string(), resp }).await.unwrap();
    answer.await.unwrap()
}

async fn get(tx: &mpsc::Sender<Command>, key: &str) -> u64 {
    let (resp, answer) = oneshot::channel();
    tx.send(Command::Get { key: key.to_string(), resp }).await.unwrap();
    answer.await.unwrap()
}

#[tokio::main]
async fn main() {
    let (tx, manager) = spawn_manager();
    incr(&tx, "visits").await;
    incr(&tx, "visits").await;
    println!("visits = {}", get(&tx, "visits").await);
    drop(tx);
    manager.await.unwrap();
}
'''

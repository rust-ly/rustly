id = "tokio.channels.challenge"
kind = "challenge"
title = "A bank teller task"
prompt = '''
A bank keeps its accounts inside one **teller** task, so balances can never be
updated by two tasks at once. Everyone else talks to the teller over a channel.

- `fn spawn_teller() -> Bank` spawns the teller and returns a `Bank` handle.
  `Bank` is `Clone`, so each customer task can have its own.
- `async fn deposit(&self, account: &str, amount: u64) -> u64` adds to the
  account (new accounts start at 0) and returns the new balance.
- `async fn withdraw(&self, account: &str, amount: u64) -> Result<u64, String>`
  takes money out and returns the new balance. If the account has less than
  `amount`, nothing changes and it returns `Err("insufficient funds")`.
- `async fn balance(&self, account: &str) -> u64` returns the balance (0 for an
  unknown account).

Fill in `Request` with whatever variants you need. Each request should carry a
`oneshot::Sender` for its reply.
'''

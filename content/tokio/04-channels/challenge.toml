hints = [
  "One variant per operation, e.g. `Deposit { account: String, amount: u64, resp: oneshot::Sender<u64> }` and `Withdraw { ..., resp: oneshot::Sender<Result<u64, String>> }`.",
  "`spawn_teller`: make the channel, spawn a task that owns a `HashMap<String, u64>` and loops on `rx.recv().await`, and return `Bank { tx }`.",
  "Each method: `let (resp, answer) = oneshot::channel(); self.tx.send(Request::...).await.unwrap(); answer.await.unwrap()`. For `withdraw`, check the balance inside the teller before subtracting.",
]
solution = '''
use std::collections::HashMap;
use tokio::sync::{mpsc, oneshot};

enum Request {
    Deposit { account: String, amount: u64, resp: oneshot::Sender<u64> },
    Withdraw { account: String, amount: u64, resp: oneshot::Sender<Result<u64, String>> },
    Balance { account: String, resp: oneshot::Sender<u64> },
}

#[derive(Clone)]
struct Bank {
    tx: mpsc::Sender<Request>,
}

fn spawn_teller() -> Bank {
    let (tx, mut rx) = mpsc::channel(32);
    tokio::spawn(async move {
        let mut accounts: HashMap<String, u64> = HashMap::new();
        while let Some(request) = rx.recv().await {
            match request {
                Request::Deposit { account, amount, resp } => {
                    let balance = accounts.entry(account).or_insert(0);
                    *balance += amount;
                    let _ = resp.send(*balance);
                }
                Request::Withdraw { account, amount, resp } => {
                    let balance = accounts.entry(account).or_insert(0);
                    let reply = if *balance >= amount {
                        *balance -= amount;
                        Ok(*balance)
                    } else {
                        Err("insufficient funds".to_string())
                    };
                    let _ = resp.send(reply);
                }
                Request::Balance { account, resp } => {
                    let _ = resp.send(accounts.get(&account).copied().unwrap_or(0));
                }
            }
        }
    });
    Bank { tx }
}

impl Bank {
    async fn deposit(&self, account: &str, amount: u64) -> u64 {
        let (resp, answer) = oneshot::channel();
        self.tx.send(Request::Deposit { account: account.to_string(), amount, resp }).await.unwrap();
        answer.await.unwrap()
    }

    async fn withdraw(&self, account: &str, amount: u64) -> Result<u64, String> {
        let (resp, answer) = oneshot::channel();
        self.tx.send(Request::Withdraw { account: account.to_string(), amount, resp }).await.unwrap();
        answer.await.unwrap()
    }

    async fn balance(&self, account: &str) -> u64 {
        let (resp, answer) = oneshot::channel();
        self.tx.send(Request::Balance { account: account.to_string(), resp }).await.unwrap();
        answer.await.unwrap()
    }
}

#[tokio::main]
async fn main() {
    let bank = spawn_teller();
    bank.deposit("ferris", 100).await;
    println!("{:?}", bank.withdraw("ferris", 30).await);
    println!("{:?}", bank.withdraw("ferris", 500).await);
    println!("balance = {}", bank.balance("ferris").await);
}
'''

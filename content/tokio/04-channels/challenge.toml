#[cfg(test)]
mod tests {
    use super::*;

    #[tokio::test]
    async fn deposits_and_withdrawals() {
        let bank = spawn_teller();
        assert_eq!(bank.balance("a").await, 0);
        assert_eq!(bank.deposit("a", 100).await, 100);
        assert_eq!(bank.deposit("a", 50).await, 150);
        assert_eq!(bank.withdraw("a", 120).await, Ok(30));
        assert_eq!(bank.balance("a").await, 30);
        assert_eq!(bank.balance("b").await, 0);
    }

    #[tokio::test]
    async fn refuses_an_overdraft() {
        let bank = spawn_teller();
        bank.deposit("a", 10).await;
        assert_eq!(bank.withdraw("a", 11).await, Err("insufficient funds".to_string()));
        assert_eq!(bank.balance("a").await, 10);
        assert_eq!(bank.withdraw("nobody", 1).await, Err("insufficient funds".to_string()));
        assert_eq!(bank.withdraw("a", 10).await, Ok(0));
    }

    #[tokio::test(flavor = "multi_thread", worker_threads = 4)]
    async fn many_customers_at_once() {
        let bank = spawn_teller();
        bank.deposit("shared", 1_000).await;
        let mut customers = Vec::new();
        for _ in 0..40 {
            let bank = bank.clone();
            customers.push(tokio::spawn(async move {
                let mut ok = 0;
                for _ in 0..5 {
                    if bank.withdraw("shared", 7).await.is_ok() {
                        ok += 1;
                    }
                    bank.deposit("tips", 1).await;
                }
                ok
            }));
        }
        let mut successes = 0;
        for c in customers {
            successes += c.await.unwrap();
        }
        // 1000 / 7 = 142 withdrawals fit; the other 58 must be refused.
        assert_eq!(successes, 142);
        assert_eq!(bank.balance("shared").await, 1_000 - 142 * 7);
        assert_eq!(bank.balance("tips").await, 200);
    }
}

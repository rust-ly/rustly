id = "tokio.select.loops.checkpoint"
kind = "checkpoint"
title = "Merge two feeds"
prompt = '''
Write `async fn merge(mut news: mpsc::Receiver<String>, mut sport: mpsc::Receiver<String>) -> Vec<String>`.

It reads both channels with a `select!` loop, as messages arrive, and collects
every message as `"news: ..."` or `"sport: ..."`. It returns once **both**
channels are closed and empty.

Messages from one channel must stay in their original order (the grader checks
each feed's order separately, not how the two are interleaved).
'''

hints = [
  "Make the deadline once, before the loop: `let deadline = sleep(budget); tokio::pin!(deadline);` and select on `&mut deadline`.",
  "`biased;` as the first line of the `select!` makes the branches be checked in order, so put the stop branch first.",
  "A dropped stop sender makes `&mut stop` finish with `Err`, and polling it again panics. Keep a `stop_open` flag and add a precondition to the branch: `signal = &mut stop, if stop_open => ...`, setting the flag to `false` on `Err`.",
  "For jobs, `job = jobs.recv() => match job { Some(n) => total += n, None => return (total, Ended::Finished) }`.",
]
solution = '''
use std::time::Duration;
use tokio::sync::{mpsc, oneshot};
use tokio::time::sleep;

#[derive(Debug, PartialEq)]
enum Ended {
    Finished,
    Stopped,
    OutOfTime,
}

async fn worker(mut jobs: mpsc::Receiver<u64>, mut stop: oneshot::Receiver<()>, budget: Duration) -> (u64, Ended) {
    let deadline = sleep(budget);
    tokio::pin!(deadline);
    let mut total = 0;
    // A finished oneshot must not be polled again, so this switches the
    // stop branch off for good once its sender is dropped.
    let mut stop_open = true;
    loop {
        tokio::select! {
            biased;
            signal = &mut stop, if stop_open => match signal {
                Ok(()) => return (total, Ended::Stopped),
                Err(_) => stop_open = false,
            },
            job = jobs.recv() => match job {
                Some(n) => total += n,
                None => return (total, Ended::Finished),
            },
            _ = &mut deadline => return (total, Ended::OutOfTime),
        }
    }
}

#[tokio::main]
async fn main() {
    let (job_tx, jobs) = mpsc::channel(8);
    let (_stop_tx, stop) = oneshot::channel();
    tokio::spawn(async move {
        for n in 1..=4 {
            job_tx.send(n).await.unwrap();
        }
    });
    println!("{:?}", worker(jobs, stop, Duration::from_secs(1)).await);
}
'''

id = "tokio.io.challenge"
kind = "challenge"
title = "A shouting server with a quit command"
prompt = '''
Write a tiny line-based server:

`async fn serve(socket: DuplexStream) -> io::Result<usize>`

- Read the client's messages **one line at a time**.
- For each line, reply with the line in upper case followed by `\n`.
  (`"hello"` gets `"HELLO\n"`.)
- If a line is exactly `quit`, reply `"BYE\n"` and stop, even if the client sent
  more lines after it.
- If the client closes its sending side, stop.

Return how many lines you shouted back, not counting `quit`.

When `serve` returns, the client must be able to finish reading the replies, so make
sure nothing keeps the server's end open.
'''

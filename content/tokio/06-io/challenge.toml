hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    async fn talk(input: &str, close: bool) -> (String, usize) {
        let (client, server) = io::duplex(16);
        let server_task = tokio::spawn(serve(server));
        let (mut rd, mut wr) = io::split(client);
        let input = input.to_string();
        let sender = tokio::spawn(async move {
            // The server may stop reading early, so ignore a broken pipe.
            let _ = wr.write_all(input.as_bytes()).await;
            if close {
                let _ = wr.shutdown().await;
            }
            wr
        });
        let mut replies = String::new();
        rd.read_to_string(&mut replies).await.unwrap();
        let _wr = sender.await.unwrap();
        (replies, server_task.await.unwrap().unwrap())

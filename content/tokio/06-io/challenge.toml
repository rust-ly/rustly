hints = [
  "Split the socket with `io::split`, wrap the read half in `BufReader::new(...)` and call `.lines()` on it.",
  "Loop with `while let Some(line) = lines.next_line().await? { ... }`. Check for `quit` first, then `writer.write_all(format!(\"{}\\n\", line.to_uppercase()).as_bytes()).await?` and count it.",
  "Without a `shutdown` or the return, the client keeps waiting. Returning from `serve` drops both halves, which closes the server's end.",
]
solution = '''
use tokio::io::{self, AsyncBufReadExt, AsyncReadExt, AsyncWriteExt, BufReader, DuplexStream};

async fn serve(socket: DuplexStream) -> io::Result<usize> {
    let (reader, mut writer) = io::split(socket);
    let mut lines = BufReader::new(reader).lines();
    let mut shouted = 0;
    while let Some(line) = lines.next_line().await? {
        if line == "quit" {
            writer.write_all(b"BYE\n").await?;
            break;
        }
        writer.write_all(format!("{}\n", line.to_uppercase()).as_bytes()).await?;
        shouted += 1;
    }
    Ok(shouted)
}

#[tokio::main]
async fn main() -> io::Result<()> {
    let (mut client, server) = io::duplex(64);
    let server_task = tokio::spawn(serve(server));
    client.write_all(b"hello\nrust is fun\nquit\nignored\n").await?;
    let mut replies = String::new();
    client.read_to_string(&mut replies).await?;
    print!("{replies}");
    println!("shouted {} lines", server_task.await.unwrap()?);
    Ok(())
}
'''

id = "tokio.io.echo.checkpoint"
kind = "checkpoint"
title = "Echo it back"
prompt = '''
Write `async fn echo(socket: DuplexStream) -> io::Result<u64>`: send back every byte the
client sends, until the client closes its sending side, and return how many bytes were
echoed.

The starter doesn't compile, because it borrows `socket` mutably twice. Split it first.
'''
starter = '''
use tokio::io::{self, AsyncReadExt, AsyncWriteExt, DuplexStream};

async fn echo(mut socket: DuplexStream) -> io::Result<u64> {
    io::copy(&mut socket, &mut socket).await
}

#[tokio::main]
async fn main() -> io::Result<()> {
    let (mut client, server) = io::duplex(64);
    let server_task = tokio::spawn(echo(server));
    client.write_all(b"ping").await?;
    client.shutdown().await?;
    let mut reply = String::new();
    client.read_to_string(&mut reply).await?;
    println!("reply: {reply}, echoed {} bytes", server_task.await.unwrap()?);
    Ok(())
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    async fn round_trip(message: &str, capacity: usize) -> (String, u64) {
        let (mut client, server) = io::duplex(capacity);
        let server_task = tokio::spawn(echo(server));
        let message = message.to_string();
        let (mut rd, mut wr) = io::split(client);
        let sender = tokio::spawn(async move {
            wr.write_all(message.as_bytes()).await.unwrap();
            wr.shutdown().await.unwrap();
        });
        let mut reply = String::new();
        rd.read_to_string(&mut reply).await.unwrap();
        sender.await.unwrap();
        (reply, server_task.await.unwrap().unwrap())
    }

    #[tokio::test]
    async fn echoes_a_short_message() {
        assert_eq!(round_trip("ping", 64).await, ("ping".to_string(), 4));
    }

    #[tokio::test]
    async fn echoes_more_than_the_pipe_holds() {
        let long = "echo ".repeat(300);
        let (reply, n) = round_trip(&long, 16).await;
        assert_eq!(reply, long);
        assert_eq!(n, 1500);
    }
}
'''
hints = [
  "`let (mut reader, mut writer) = io::split(socket);` gives you two halves you can borrow separately.",
  "Then `io::copy(&mut reader, &mut writer).await` does the echo and returns the byte count.",
]
solution = '''
use tokio::io::{self, AsyncReadExt, AsyncWriteExt, DuplexStream};

async fn echo(socket: DuplexStream) -> io::Result<u64> {
    let (mut reader, mut writer) = io::split(socket);
    io::copy(&mut reader, &mut writer).await
}

#[tokio::main]
async fn main() -> io::Result<()> {
    let (mut client, server) = io::duplex(64);
    let server_task = tokio::spawn(echo(server));
    client.write_all(b"ping").await?;
    client.shutdown().await?;
    let mut reply = String::new();
    client.read_to_string(&mut reply).await?;
    println!("reply: {reply}, echoed {} bytes", server_task.await.unwrap()?);
    Ok(())
}
'''

hints = [
  "`match light { Light::Red => 30, ... }` with one arm per variant.",
  "Because `light` is a reference, matching on `Light::Red` still works: Rust looks through the `&` for you.",
]
solution = '''
#[derive(Debug, PartialEq)]
enum Light {
    Red,
    Yellow,
    Green,
}

fn seconds(light: &Light) -> u32 {
    match light {
        Light::Red => 30,
        Light::Yellow => 3,
        Light::Green => 25,
    }
}

fn next(light: &Light) -> Light {
    match light {
        Light::Red => Light::Green,
        Light::Green => Light::Yellow,
        Light::Yellow => Light::Red,
    }
}

fn main() {
    let light = Light::Red;
    println!("{light:?} for {}s, then {:?}", seconds(&light), next(&light));
}
'''

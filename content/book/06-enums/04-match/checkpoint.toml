id = "book.enums.match.checkpoint"
kind = "checkpoint"
title = "Traffic lights"
prompt = '''
Write two functions with `match`:

- `seconds(light: &Light) -> u32`: how long each light stays on.
  `Red` is 30 seconds, `Yellow` is 3 and `Green` is 25.
- `next(light: &Light) -> Light`: the light that comes after it.
  Red goes to Green, Green to Yellow, and Yellow back to Red.
'''

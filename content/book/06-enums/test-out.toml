hints = [
  "Add the two variants: `Say(String)` holds a tuple value and `Move { x: i32, y: i32 }` has named fields.",
  "`line.split_once(' ')` gives `Some((\"say\", \"hello there\"))`. With `let Some((word, rest)) = line.split_once(' ') else { ... };` you can handle the no-space case first.",
  "For `move`, `rest.split_once(' ')` gives the two numbers, and `.parse().ok()?` turns a bad number into `None`.",
  "In `position`, loop over the commands and `match` each one: add for `Move`, `break` for `Quit`, and `_ => {}` for the rest.",
]
solution = '''
#[derive(Debug, PartialEq)]
enum Command {
    Quit,
    Say(String),
    Move { x: i32, y: i32 },
}

fn parse(line: &str) -> Option<Command> {
    if line == "quit" {
        return Some(Command::Quit);
    }
    let Some((word, rest)) = line.split_once(' ') else {
        return None;
    };
    match word {
        "say" => Some(Command::Say(rest.to_string())),
        "move" => {
            let (x, y) = rest.split_once(' ')?;
            Some(Command::Move {
                x: x.parse().ok()?,
                y: y.parse().ok()?,
            })
        }
        _ => None,
    }
}

fn position(commands: &[Command]) -> (i32, i32) {
    let (mut x, mut y) = (0, 0);
    for command in commands {
        match command {
            Command::Move { x: dx, y: dy } => {
                x += dx;
                y += dy;
            }
            Command::Quit => break,
            Command::Say(_) => {}
        }
    }
    (x, y)
}

fn main() {
    let commands: Vec<Command> = ["move 2 3", "say hi", "move -1 0", "quit", "move 9 9"]
        .iter()
        .filter_map(|line| parse(line))
        .collect();
    println!("{:?}", position(&commands));
}
'''

hints = [
  "In `value`, the quarter arm can ignore its state: `Coin::Quarter(_) => 25`.",
  "Loop with `for coin in coins` and add up `coin.value()`.",
  "`if let Coin::Quarter(s) = coin { if *s == state { count += 1; } }`",
  "For the first quarter, return early from inside the loop with `return Some(*s);`, and return `None` after it.",
]
solution = '''
#[derive(Debug, Clone, Copy, PartialEq)]
enum State {
    Alabama,
    Alaska,
    Hawaii,
}

#[derive(Debug)]
enum Coin {
    Penny,
    Nickel,
    Dime,
    Quarter(State),
}

impl Coin {
    fn value(&self) -> u32 {
        match self {
            Coin::Penny => 1,
            Coin::Nickel => 5,
            Coin::Dime => 10,
            Coin::Quarter(_) => 25,
        }
    }
}

fn total(coins: &[Coin]) -> u32 {
    let mut sum = 0;
    for coin in coins {
        sum += coin.value();
    }
    sum
}

fn quarters_from(coins: &[Coin], state: State) -> usize {
    let mut count = 0;
    for coin in coins {
        if let Coin::Quarter(s) = coin {
            if *s == state {
                count += 1;
            }
        }
    }
    count
}

fn first_quarter_state(coins: &[Coin]) -> Option<State> {
    for coin in coins {
        if let Coin::Quarter(s) = coin {
            return Some(*s);
        }
    }
    None
}

fn main() {
    let coins = [Coin::Dime, Coin::Quarter(State::Alaska), Coin::Penny];
    println!("total: {} cents", total(&coins));
    println!("from Alaska: {}", quarters_from(&coins, State::Alaska));
    println!("first quarter: {:?}", first_quarter_state(&coins));
}
'''

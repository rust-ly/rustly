hints = [
  "`Shape::Circle(r) => PI * r * r` binds the radius to `r`.",
  "For the triangle: `Shape::Triangle { base, height } => base * height / 2.0`.",
  "`double` is just like `plus_one`: `Some(v) => Some(v * 2.0)`.",
]
solution = '''
use std::f64::consts::PI;

enum Shape {
    Circle(f64),
    Rectangle(f64, f64),
    Triangle { base: f64, height: f64 },
}

fn area(shape: &Shape) -> f64 {
    match shape {
        Shape::Circle(r) => PI * r * r,
        Shape::Rectangle(w, h) => w * h,
        Shape::Triangle { base, height } => base * height / 2.0,
    }
}

fn double(x: Option<f64>) -> Option<f64> {
    match x {
        None => None,
        Some(v) => Some(v * 2.0),
    }
}

fn main() {
    println!("{:.2}", area(&Shape::Circle(1.0)));
    println!("{:?}", double(Some(2.5)));
}
'''

title = "Producers and a consumer"
prompt = '''
Write `async fn gather(names: Vec<String>) -> Vec<String>`:

- Create a `tokio::sync::mpsc` channel with capacity 4.
- Spawn one task per name, each with its own clone of the sender, sending
  `"hello, NAME"`.
- Drop the original sender, then receive with `while let Some(msg) = rx.recv().await`.
- Return the messages **sorted**.
'''

hints = [
  "`let (tx, mut rx) = mpsc::channel(4);`",
  "For each name: `let tx = tx.clone(); tokio::spawn(async move { tx.send(format!(\"hello, {name}\")).await.unwrap(); });`",
  "`drop(tx);` before the `while let` loop, or it never ends.",
]
solution = '''
use tokio::sync::mpsc;

async fn gather(names: Vec<String>) -> Vec<String> {
    let (tx, mut rx) = mpsc::channel(4);
    for name in names {
        let tx = tx.clone();
        tokio::spawn(async move {
            tx.send(format!("hello, {name}")).await.unwrap();
        });
    }
    drop(tx);
    let mut out = Vec::new();
    while let Some(msg) = rx.recv().await {
        out.push(msg);
    }
    out.sort();
    out
}

#[tokio::main]
async fn main() {
    let names = vec![String::from("Grace"), String::from("Ada")];
    println!("{:?}", gather(names).await);
}
'''

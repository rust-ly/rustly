solution = '''
use std::time::Duration;
use tokio::task::JoinSet;
use tokio::time::{sleep, timeout};

async fn fetch(name: &'static str, ms: u64) -> &'static str {
    sleep(Duration::from_millis(ms)).await;
    name
}

async fn fastest(a: (&'static str, u64), b: (&'static str, u64)) -> &'static str {
    tokio::select! {
        x = fetch(a.0, a.1) => x,
        y = fetch(b.0, b.1) => y,
    }
}

async fn fetch_within(name: &'static str, ms: u64, limit_ms: u64) -> Result<&'static str, String> {
    timeout(Duration::from_millis(limit_ms), fetch(name, ms))
        .await
        .map_err(|_| String::from("timed out"))
}

async fn fetch_all(mirrors: Vec<(&'static str, u64)>) -> Vec<&'static str> {
    let mut set = JoinSet::new();
    for (name, ms) in mirrors {
        set.spawn(fetch(name, ms));
    }
    let mut out = Vec::new();
    while let Some(result) = set.join_next().await {
        out.push(result.unwrap());
    }
    out
}

#[tokio::main]
async fn main() {
    println!("{}", fastest(("eu", 50), ("us", 20)).await);
    println!("{:?}", fetch_within("slow", 300, 100).await);
    println!("{:?}", fetch_all(vec![("a", 30), ("b", 10), ("c", 20)]).await);
}
'''

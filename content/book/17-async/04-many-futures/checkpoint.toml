title = "Fastest mirror, with a deadline"
prompt = '''
`fetch(name, ms)` pretends to download from a mirror that takes `ms` milliseconds.
Write:

- `async fn fastest(a: (&'static str, u64), b: (&'static str, u64)) -> &'static str`:
  races the two mirrors with `tokio::select!` and returns the winner's name.
- `async fn fetch_within(name: &'static str, ms: u64, limit_ms: u64) -> Result<&'static str, String>`:
  uses `tokio::time::timeout`, returning `Err("timed out")` if the mirror takes longer
  than `limit_ms`.
- `async fn fetch_all(mirrors: Vec<(&'static str, u64)>) -> Vec<&'static str>`: fetches
  every mirror concurrently with a `JoinSet` and returns the names **in the order they
  finished**.
'''

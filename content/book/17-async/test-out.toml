hints = [
  "`tokio::join!(fetch(\"a\", a_ms), fetch(\"b\", b_ms))` runs both futures at once and gives you a tuple of their results.",
  "`tokio::select!` returns from whichever branch finishes first and drops the other. Put `biased;` first so the `a` branch is checked first when both are ready.",
  "For `sum_messages`, `let (tx, mut rx) = mpsc::channel(16);` then `tokio::spawn(async move { for i in 1..=n { tx.send(i).await.unwrap(); } });`. The task owns `tx`, so the channel closes when it ends.",
  "`while let Some(value) = rx.recv().await { total += value; }` stops when the channel closes.",
]
solution = '''
use std::time::Duration;
use tokio::sync::mpsc;
use tokio::time::sleep;

async fn fetch(name: &str, ms: u64) -> String {
    sleep(Duration::from_millis(ms)).await;
    name.to_string()
}

async fn fetch_both(a_ms: u64, b_ms: u64) -> (String, String) {
    tokio::join!(fetch("a", a_ms), fetch("b", b_ms))
}

async fn first_back(a_ms: u64, b_ms: u64) -> String {
    tokio::select! {
        biased;
        a = fetch("a", a_ms) => a,
        b = fetch("b", b_ms) => b,
    }
}

async fn sum_messages(n: u64) -> u64 {
    let (tx, mut rx) = mpsc::channel(16);
    tokio::spawn(async move {
        for i in 1..=n {
            tx.send(i).await.unwrap();
        }
    });
    let mut total = 0;
    while let Some(value) = rx.recv().await {
        total += value;
    }
    total
}

#[tokio::main]
async fn main() {
    println!("{:?}", fetch_both(30, 20).await);
    println!("{}", first_back(30, 20).await);
    println!("{}", sum_messages(10).await);
}
'''

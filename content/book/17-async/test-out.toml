title = "Waiting well"
prompt = '''
Already know futures, `join!`, `select!` and async channels? Pass this to
complete the whole chapter.

`fetch(name, ms)` is given: it waits `ms` milliseconds, then returns `name`.
Write three async functions:

1. `fetch_both(a_ms, b_ms) -> (String, String)`: fetch `"a"` and `"b"` **at
   the same time**, so the total wait is the longer of the two, not their sum.
2. `first_back(a_ms, b_ms) -> String`: start fetching `"a"` and `"b"` and
   return whichever finishes first. If they tie, `"a"` wins.
3. `sum_messages(n) -> u64`: spawn a task that sends the numbers `1` to `n` down
   a `tokio::sync::mpsc` channel, receive them until the channel closes, and
   return their total.
'''

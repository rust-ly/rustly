id = "book.async.challenge"
kind = "challenge"
title = "Collect results before the deadline"
prompt = '''
Several sensors report readings, each after its own delay. Gather what arrives in time:

`async fn collect_readings(sensors: Vec<(String, u64, i32)>, deadline_ms: u64) -> Vec<(String, i32)>`

- Each sensor is `(name, delay_ms, value)`. Spawn one **task** per sensor that sleeps
  `delay_ms` and then sends `(name, value)` on a `tokio::sync::mpsc` channel.
- Receive readings until **either** every sensor has reported **or** `deadline_ms` has
  passed since the start, whichever comes first. (`tokio::time::timeout` around the
  whole receiving loop works; so does `tokio::select!` against a `sleep`.)
- Return the readings that arrived in time, **sorted by name**.

A sensor that reports exactly at the deadline may or may not count, so the tests
avoid that case.
'''

title = "A future that's ready on the second poll"
prompt = '''
Implement `Future` for `Countdown`, a future that returns `Poll::Pending` the first
`remaining` times it's polled, then `Poll::Ready("done")`.

Before returning `Pending`, it must call `cx.waker().wake_by_ref()`, which tells the
runtime to poll it again (otherwise it would wait forever).

The grader awaits it and also checks how many times it was polled.
'''

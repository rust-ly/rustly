solution = '''
use futures::stream::{self, StreamExt};

async fn label(n: i32) -> String {
    format!("{n}°C")
}

async fn above(readings: Vec<i32>, limit: i32) -> Vec<i32> {
    stream::iter(readings)
        .filter(|n| futures::future::ready(*n > limit))
        .collect()
        .await
}

async fn labelled(readings: Vec<i32>) -> Vec<String> {
    stream::iter(readings).then(label).collect().await
}

async fn first_n_total(readings: Vec<i32>, n: usize) -> i32 {
    let mut s = stream::iter(readings).take(n);
    let mut total = 0;
    while let Some(x) = s.next().await {
        total += x;
    }
    total
}

#[tokio::main]
async fn main() {
    let r = vec![18, 25, 21, 30];
    println!("{:?}", above(r.clone(), 20).await);
    println!("{:?}", labelled(r.clone()).await);
    println!("{}", first_n_total(r, 2).await);
}
'''

title = "Process a stream of readings"
prompt = '''
Temperature readings arrive as a stream of `i32`s. Using `futures::stream` and
`StreamExt`, write:

- `async fn above(readings: Vec<i32>, limit: i32) -> Vec<i32>`: the readings strictly
  above `limit`, in order (`stream::iter`, `filter`, `collect`).
- `async fn labelled(readings: Vec<i32>) -> Vec<String>`: each reading as `"N°C"`,
  produced with the async `label(n)` function and `then`.
- `async fn first_n_total(readings: Vec<i32>, n: usize) -> i32`: the sum of the first
  `n` readings, using `take` and a `while let ... next().await` loop.
'''

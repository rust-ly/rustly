title = "Longest word, louder"
prompt = '''
Already know moves, borrowing and slices? Pass this to complete the whole chapter.

Write two functions:

1. `longest_word(text)` returns a slice of `text` holding its longest word, where
   words are separated by spaces. If two words are equally long, return the first.
   For empty text, return `""`.
2. `shout(text)` changes `text` in place to upper case and adds a `!` at the end.

Neither function may take ownership of its argument. The tests call them as
`longest_word(&text)` and `shout(&mut text)`, and use `text` afterwards.
'''

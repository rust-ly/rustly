}
'''
hints = [
  "`fn expect(initials: fn(&str) -> String, name: &str, want: &str) { assert_eq!(initials(name), want, \"initials of {name:?}\"); }`",
  "Cases to cover: `\"ada lovelace\"`, `\"Cher\"`, `\"Grace Brewster Hopper\"`, `\"  Linus   Torvalds \"` and `\"\"`.",
]
solution = '''
fn expect(initials: fn(&str) -> String, name: &str, want: &str) {
    assert_eq!(initials(name), want, "initials of {name:?}");
}

fn check_initials(initials: fn(&str) -> String) {
    expect(initials, "Ada Lovelace", "AL");
    expect(initials, "ada lovelace", "AL");
    expect(initials, "Cher", "C");
    expect(initials, "Grace Brewster Hopper", "GBH");
    expect(initials, "  Linus   Torvalds ", "LT");
    expect(initials, "", "");
}

fn my_initials(name: &str) -> String {
    let mut out = String::new();
    for word in name.split_whitespace() {
        out.push(word.chars().next().unwrap().to_ascii_uppercase());
    }
    out
}

fn main() {
    check_initials(my_initials);
    println!("my_initials passed every check");
}
'''

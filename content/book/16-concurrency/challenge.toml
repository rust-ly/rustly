id = "book.concurrency.challenge"
kind = "challenge"
title = "A worker pool with progress"
prompt = '''
Process jobs with a fixed number of worker threads:

`run_jobs(jobs: Vec<u64>, workers: usize) -> (Vec<u64>, usize)`

- Put every job into a channel (the **job queue**), then drop the sender so the queue
  closes when it's empty.
- Share the receiver between `workers` threads with `Arc<Mutex<Receiver<u64>>>`. Each
  worker loops: lock the receiver, take one job with `recv()`, **release the lock**,
  and stop when `recv()` returns `Err` (the queue is empty and closed).
- For each job `n`, the result is `n * n`. Send results back to the main thread on a
  second channel.
- Count how many jobs were done in a shared `Arc<Mutex<usize>>`.
- Return the results **sorted**, and the count.

`workers` is at least 1.
'''

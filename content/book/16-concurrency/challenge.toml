hints = [
  "Fill the queue first: `let (job_tx, job_rx) = mpsc::channel(); for j in jobs { job_tx.send(j).unwrap(); } drop(job_tx);`",
  "`let job_rx = Arc::new(Mutex::new(job_rx));` then clone it into each worker.",
  "In a worker: `loop { let job = job_rx.lock().unwrap().recv(); let Ok(n) = job else { break; }; ... }`. The lock is released at the end of the `let job = ...` statement.",
  "Drop the main thread's result sender after spawning, then collect with `for r in result_rx`, and join the workers.",
]
solution = '''
use std::sync::mpsc;
use std::sync::{Arc, Mutex};
use std::thread;

fn run_jobs(jobs: Vec<u64>, workers: usize) -> (Vec<u64>, usize) {
    let (job_tx, job_rx) = mpsc::channel();
    for j in jobs {
        job_tx.send(j).unwrap();
    }
    drop(job_tx);

    let job_rx = Arc::new(Mutex::new(job_rx));
    let done = Arc::new(Mutex::new(0usize));
    let (result_tx, result_rx) = mpsc::channel();

    let mut handles = Vec::new();
    for _ in 0..workers {
        let job_rx = Arc::clone(&job_rx);
        let done = Arc::clone(&done);
        let result_tx = result_tx.clone();
        handles.push(thread::spawn(move || loop {
            let job = job_rx.lock().unwrap().recv();
            let Ok(n) = job else {
                break;
            };
            result_tx.send(n * n).unwrap();
            *done.lock().unwrap() += 1;
        }));
    }
    drop(result_tx);

    let mut results: Vec<u64> = result_rx.iter().collect();
    for h in handles {
        h.join().unwrap();
    }
    results.sort();
    let count = *done.lock().unwrap();
    (results, count)
}

fn main() {
    let (results, done) = run_jobs(vec![4, 1, 3, 2], 2);
    println!("{results:?} ({done} jobs)");
}
'''

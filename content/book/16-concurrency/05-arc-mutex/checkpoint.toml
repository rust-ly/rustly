id = "book.concurrency.arc-mutex.checkpoint"
kind = "checkpoint"
title = "Threads fill a shared list"
prompt = '''
Write `collect_in_threads(items: Vec<String>) -> Vec<String>`:

- Create a shared `Arc<Mutex<Vec<String>>>`.
- Spawn one thread per item. Each thread gets its own `Arc::clone` and pushes the item
  in upper case into the shared vector.
- Join every thread, then take the vector out (`lock().unwrap().clone()`), **sort** it
  and return it.
'''
starter = '''
use std::rc::Rc;
use std::cell::RefCell;
use std::thread;

fn collect_in_threads(items: Vec<String>) -> Vec<String> {
    let shared = Rc::new(RefCell::new(Vec::new()));
    let mut handles = Vec::new();
    for item in items {
        let shared = Rc::clone(&shared);
        handles.push(thread::spawn(move || {
            shared.borrow_mut().push(item.to_uppercase());
        }));
    }
    for h in handles {
        h.join().unwrap();
    }
    let mut out = shared.borrow().clone();
    out.sort();
    out
}

fn main() {
    let items = vec![String::from("b"), String::from("a"), String::from("c")];
    println!("{:?}", collect_in_threads(items));
}
'''
hidden_tests = '''

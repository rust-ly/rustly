'''
hints = [
  "The starter uses `Rc<RefCell<...>>`, which can't cross threads. Swap in `Arc` and `Mutex` from `std::sync`.",
  "`shared.lock().unwrap().push(item.to_uppercase());` inside each thread.",
  "After joining: `let mut out = shared.lock().unwrap().clone(); out.sort(); out`",
]
solution = '''
use std::sync::{Arc, Mutex};
use std::thread;

fn collect_in_threads(items: Vec<String>) -> Vec<String> {
    let shared = Arc::new(Mutex::new(Vec::new()));
    let mut handles = Vec::new();
    for item in items {
        let shared = Arc::clone(&shared);
        handles.push(thread::spawn(move || {
            shared.lock().unwrap().push(item.to_uppercase());
        }));
    }
    for h in handles {
        h.join().unwrap();
    }
    let mut out = shared.lock().unwrap().clone();
    out.sort();
    out
}

fn main() {
    let items = vec![String::from("b"), String::from("a"), String::from("c")];
    println!("{:?}", collect_in_threads(items));
}
'''

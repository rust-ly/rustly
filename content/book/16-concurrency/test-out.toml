hints = [
  "For `parallel_sum`, `numbers.chunks(size)` splits a slice, with `size = numbers.len().div_ceil(threads).max(1)`. Each thread needs its own data, so `chunk.to_vec()` and `move` it into the closure.",
  "Keep the `JoinHandle`s in a `Vec`, then `handles.into_iter().map(|h| h.join().unwrap()).sum()`.",
  "For `greetings`, give each thread a `tx.clone()`, then `drop(tx)` the original so `rx.iter()` ends once every thread is done. Collect, then `sort()`.",
  "For `shared_count`, `let counter = Arc::new(Mutex::new(0));` and give each thread `Arc::clone(&counter)`. Inside, `*counter.lock().unwrap() += 1`.",
]
solution = '''
use std::sync::{Arc, Mutex, mpsc};
use std::thread;

fn parallel_sum(numbers: Vec<u64>, threads: usize) -> u64 {
    let size = numbers.len().div_ceil(threads.max(1)).max(1);
    let handles: Vec<_> = numbers
        .chunks(size)
        .map(|chunk| {
            let chunk = chunk.to_vec();
            thread::spawn(move || chunk.iter().sum::<u64>())
        })
        .collect();
    handles.into_iter().map(|h| h.join().unwrap()).sum()
}

fn greetings(names: Vec<String>) -> Vec<String> {
    let (tx, rx) = mpsc::channel();
    for name in names {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send(format!("hello from {name}")).unwrap();
        });
    }
    drop(tx);
    let mut messages: Vec<String> = rx.iter().collect();
    messages.sort();
    messages
}

fn shared_count(threads: usize, per_thread: usize) -> usize {
    let counter = Arc::new(Mutex::new(0));
    let handles: Vec<_> = (0..threads)
        .map(|_| {
            let counter = Arc::clone(&counter);
            thread::spawn(move || {
                for _ in 0..per_thread {
                    *counter.lock().unwrap() += 1;
                }
            })
        })
        .collect();
    for handle in handles {
        handle.join().unwrap();
    }
    *counter.lock().unwrap()
}

fn main() {
    println!("{}", parallel_sum((1..=100).collect(), 4));
    println!("{:?}", greetings(vec!["ada".to_string(), "bo".to_string()]));
    println!("{}", shared_count(8, 1000));
}
'''

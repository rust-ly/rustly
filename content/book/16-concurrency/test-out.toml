Already know threads, channels and `Arc<Mutex<T>>`? Pass this to complete the
whole chapter.

Write three functions, each using a different tool from the chapter:

1. `parallel_sum(numbers: Vec<u64>, threads: usize) -> u64`: split `numbers`
   into `threads` chunks, add up each chunk on its own spawned thread, then
   `join` them and add up the results.
2. `greetings(names: Vec<String>) -> Vec<String>`: spawn one thread per name.
   Each thread sends `"hello from NAME"` down an `mpsc` channel. Return every
   message, sorted.
3. `shared_count(threads: usize, per_thread: usize) -> usize`: spawn `threads`
   threads that each add 1 to a shared counter `per_thread` times, using
   `Arc<Mutex<usize>>`. Return the final count.
'''

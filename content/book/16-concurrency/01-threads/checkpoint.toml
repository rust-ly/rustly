hints = [
  "`let mut handles = Vec::new();` then for each `(start, end)`, push `thread::spawn(move || (start..=end).sum::<u64>())`.",
  "Join them: `handles.into_iter().map(|h| h.join().unwrap()).sum()`.",
]
solution = '''
use std::thread;

fn parallel_sum(ranges: Vec<(u64, u64)>) -> u64 {
    let mut handles = Vec::new();
    for (start, end) in ranges {
        handles.push(thread::spawn(move || (start..=end).sum::<u64>()));
    }
    handles.into_iter().map(|h| h.join().unwrap()).sum()
}

fn main() {
    let total = parallel_sum(vec![(1, 50), (51, 100)]);
    println!("total = {total}");
}
'''

id = "book.concurrency.threads.checkpoint"
kind = "checkpoint"
title = "Sum in parallel"
prompt = '''
Write `parallel_sum(ranges: Vec<(u64, u64)>) -> u64`. For each `(start, end)` pair,
spawn a thread that sums the numbers from `start` to `end` **inclusive**. Collect the
`JoinHandle`s, then join them all and add up their results.

Each closure needs its own copy of `start` and `end`: write `move ||` (the next
concept explains why).
'''
starter = '''

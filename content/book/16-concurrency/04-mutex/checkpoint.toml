title = "A thread-safe tally"
prompt = '''
`Tally` wraps a `Mutex<HashMap<String, u32>>`. Every method takes `&self` (not
`&mut self`), as it would if several threads shared it, and locks the mutex inside:

- `Tally::new() -> Tally`
- `record(&self, name: &str)`: adds one to `name`'s count.
- `count(&self, name: &str) -> u32`: the count, or 0 if never recorded.
- `total(&self) -> u32`: the sum of all counts.

Keep each lock short: don't call one method from another while holding the lock.
'''

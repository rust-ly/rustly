id = "book.concurrency.channels.checkpoint"
kind = "checkpoint"
title = "Workers report back"
prompt = '''
Write `squares_from_workers(numbers: Vec<u64>) -> Vec<u64>`:

- Create a channel.
- For each number, spawn a thread with its **own clone** of the transmitter; the
  thread sends the number squared.
- Drop the original transmitter (`drop(tx)`), so the channel closes once every worker
  is done.
- Receive everything with a `for` loop over the receiver, then **sort** the results
  (threads finish in any order) and return them.
'''
starter = '''

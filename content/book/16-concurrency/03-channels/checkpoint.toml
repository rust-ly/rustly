hints = [
  "`let (tx, rx) = mpsc::channel();` then in the loop: `let tx = tx.clone(); thread::spawn(move || tx.send(n * n).unwrap());`",
  "After the loop, `drop(tx);`. Otherwise the original transmitter keeps the channel open and the `for` loop waits forever.",
  "`let mut results: Vec<u64> = rx.iter().collect(); results.sort(); results`",
]
solution = '''
use std::sync::mpsc;
use std::thread;

fn squares_from_workers(numbers: Vec<u64>) -> Vec<u64> {
    let (tx, rx) = mpsc::channel();
    for n in numbers {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send(n * n).unwrap();
        });
    }
    drop(tx);
    let mut results = Vec::new();
    for value in rx {
        results.push(value);
    }
    results.sort();
    results
}

fn main() {
    println!("{:?}", squares_from_workers(vec![3, 1, 2]));
}
'''

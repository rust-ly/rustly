hints = [
  "`text.split_once(':')` returns an `Option`. `.ok_or(TimeError::NoColon)?` turns `None` into your error and returns it early.",
  "`.parse::<u32>()` returns a `Result` with a `ParseIntError`. `.map_err(|_| TimeError::NotANumber)?` swaps in your own error.",
  "Check the ranges after parsing: `if hours > 23 || minutes > 59 { return Err(TimeError::OutOfRange); }`.",
  "In `minutes_between`, `let start = parse_time(start)?;` does all the error handling for you. Compare the two numbers before subtracting, since a `u32` can't go below zero.",
]
solution = '''
#[derive(Debug, PartialEq)]
enum TimeError {
    NoColon,
    NotANumber,
    OutOfRange,
    Backwards,
}

fn parse_time(text: &str) -> Result<u32, TimeError> {
    let (hours, minutes) = text.split_once(':').ok_or(TimeError::NoColon)?;
    let hours: u32 = hours.parse().map_err(|_| TimeError::NotANumber)?;
    let minutes: u32 = minutes.parse().map_err(|_| TimeError::NotANumber)?;
    if hours > 23 || minutes > 59 {
        return Err(TimeError::OutOfRange);
    }
    Ok(hours * 60 + minutes)
}

fn minutes_between(start: &str, end: &str) -> Result<u32, TimeError> {
    let start = parse_time(start)?;
    let end = parse_time(end)?;
    if end < start {
        return Err(TimeError::Backwards);
    }
    Ok(end - start)
}

fn main() {
    println!("{:?}", minutes_between("09:30", "17:15"));
    println!("{:?}", minutes_between("9.30", "17:15"));
}
'''

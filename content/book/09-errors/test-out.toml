title = "Minutes between times"
prompt = '''
Already know `Result`, `?` and when to panic? Pass this to complete the whole
chapter.

Times are written like `"09:30"`, on a 24-hour clock. Write two functions that
return a `TimeError` instead of panicking:

1. `parse_time(text) -> Result<u32, TimeError>`: the number of minutes since
   midnight, so `"09:30"` is `570`.
   - no `:` in the text is `TimeError::NoColon`
   - an hour or minute that isn't a whole number is `TimeError::NotANumber`
   - an hour above 23 or a minute above 59 is `TimeError::OutOfRange`
2. `minutes_between(start, end) -> Result<u32, TimeError>`: how many minutes
   from `start` to `end`. It passes on any error from either time, and returns
   `TimeError::Backwards` if `end` is earlier than `start`.

Use `?` in `minutes_between`.
'''
starter = '''

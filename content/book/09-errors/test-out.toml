    #[test]
    fn reports_each_kind_of_bad_time() {
        assert_eq!(parse_time("0930"), Err(TimeError::NoColon));
        assert_eq!(parse_time("nine:30"), Err(TimeError::NotANumber));
        assert_eq!(parse_time("09:"), Err(TimeError::NotANumber));
        assert_eq!(parse_time("24:00"), Err(TimeError::OutOfRange));
        assert_eq!(parse_time("12:60"), Err(TimeError::OutOfRange));
    }


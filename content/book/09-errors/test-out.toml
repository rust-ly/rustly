fn parse_time(text: &str) -> Result<u32, TimeError> {
    let (hours, minutes) = text.split_once(':').unwrap();
    let hours: u32 = hours.parse().unwrap();
    let minutes: u32 = minutes.parse().unwrap();
    Ok(hours * 60 + minutes)
}

fn minutes_between(start: &str, end: &str) -> Result<u32, TimeError> {
    todo!()
}

fn main() {
    println!("{:?}", minutes_between("09:30", "17:15"));
    println!("{:?}", minutes_between("9.30", "17:15"));
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn parses_good_times() {
        assert_eq!(parse_time("00:00"), Ok(0));
        assert_eq!(parse_time("09:30"), Ok(570));
        assert_eq!(parse_time("23:59"), Ok(1439));

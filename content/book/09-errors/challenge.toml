solution = '''
#[derive(Debug, PartialEq)]
enum ConfigError {
    MissingEquals(String),
    UnknownKey(String),
    BadPort(String),
    BadDebug(String),
    Missing(&'static str),
}

#[derive(Debug, PartialEq)]
struct Settings {
    name: String,
    port: u16,
    debug: bool,
}

fn parse_line(line: &str) -> Result<(String, String), ConfigError> {
    let (key, value) = line
        .split_once('=')
        .ok_or(ConfigError::MissingEquals(line.to_string()))?;
    Ok((key.trim().to_string(), value.trim().to_string()))
}

fn parse_settings(text: &str) -> Result<Settings, ConfigError> {
    let mut name: Option<String> = None;
    let mut port: Option<u16> = None;
    let mut debug = false;
    for line in text.lines() {
        if line.trim().is_empty() {
            continue;
        }
        let (key, value) = parse_line(line)?;
        match key.as_str() {
            "name" => name = Some(value),
            "port" => {
                let p = value.parse::<u16>().ok().ok_or(ConfigError::BadPort(value.clone()))?;
                port = Some(p);
            }
            "debug" => {
                debug = match value.as_str() {
                    "true" => true,
                    "false" => false,
                    _ => return Err(ConfigError::BadDebug(value)),
                };
            }
            _ => return Err(ConfigError::UnknownKey(key)),
        }
    }
    let name = name.ok_or(ConfigError::Missing("name"))?;
    let port = port.ok_or(ConfigError::Missing("port"))?;
    Ok(Settings { name, port, debug })
}

fn main() {
    let text = "name = Rustly\nport = 8080\n\ndebug = true";
    println!("{:?}", parse_settings(text));
    println!("{:?}", parse_settings("port = eighty"));
}
'''

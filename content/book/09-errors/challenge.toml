id = "book.errors.challenge"
kind = "challenge"
title = "Read a settings file"
prompt = '''
A settings file has one `key = value` setting per line. Parse it into a `Settings`
struct, reporting a precise error when something is wrong.

```text
name = Rustly
port = 8080
debug = true
```

1. `parse_line(line: &str) -> Result<(String, String), ConfigError>` splits a line
   at the first `=` and trims spaces from both sides. A line with no `=` is
   `ConfigError::MissingEquals(line)` (the original line). (`line.split_once('=')`
   returns an `Option<(&str, &str)>`.)
2. `parse_settings(text: &str) -> Result<Settings, ConfigError>` reads every line,
   skipping blank ones. Use `?` to pass errors up.
   - `port` must parse as a `u16`, otherwise `ConfigError::BadPort(value)`.
   - `debug` must be `true` or `false`, otherwise `ConfigError::BadDebug(value)`.
   - `name` is any text.
   - Any other key is `ConfigError::UnknownKey(key)`.
   - If `name` or `port` never appears, return `ConfigError::Missing("name")` or
     `ConfigError::Missing("port")`. `debug` is optional and defaults to `false`.
'''

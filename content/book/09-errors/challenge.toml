hints = [
  "`let (key, value) = line.split_once('=').ok_or(ConfigError::MissingEquals(line.to_string()))?;` then return the trimmed parts.",
  "Keep `let mut name: Option<String> = None;`, `let mut port: Option<u16> = None;` and `let mut debug = false;`, then `match key.as_str() { ... }` for each line.",
  "`value.parse::<u16>().ok().ok_or(ConfigError::BadPort(value.clone()))?` turns a bad port into your own error.",

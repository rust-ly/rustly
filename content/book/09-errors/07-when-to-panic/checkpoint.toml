id = "book.errors.when-to-panic.checkpoint"
kind = "checkpoint"
title = "A percentage that's always valid"
prompt = '''
Make `Percentage` a type that can only hold 0 to 100:

- Keep the `value` field private.
- `Percentage::new(value: u8) -> Result<Percentage, String>` returns
  `Err("percentage must be 0-100, got N")` for values over 100, and `Ok` otherwise.
- `value(&self) -> u8` returns the value.
- `of(&self, amount: u32) -> u32` returns that percentage of `amount`, using
  integer maths: `amount * value / 100`.
'''
starter = '''

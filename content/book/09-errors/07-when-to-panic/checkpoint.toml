hints = [
  "`pub fn new(value: u8) -> Result<Percentage, String> { if value > 100 { return Err(format!(...)); } Ok(Percentage { value }) }`",
  "In `of`, convert the `u8` first: `amount * self.value as u32 / 100`.",
]
solution = '''
pub struct Percentage {
    value: u8,
}

impl Percentage {
    pub fn new(value: u8) -> Result<Percentage, String> {
        if value > 100 {
            return Err(format!("percentage must be 0-100, got {value}"));
        }
        Ok(Percentage { value })
    }

    pub fn value(&self) -> u8 {
        self.value
    }

    pub fn of(&self, amount: u32) -> u32 {
        amount * self.value as u32 / 100
    }
}

fn main() {
    let tip = Percentage::new(15).unwrap();
    println!("{}% of 2000 is {}", tip.value(), tip.of(2000));
    println!("{:?}", Percentage::new(150).err());
}
'''

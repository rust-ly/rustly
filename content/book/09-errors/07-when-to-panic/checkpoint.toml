hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn valid_percentages() {
        let p = Percentage::new(15).unwrap();
        assert_eq!(p.value(), 15);
        assert_eq!(p.of(2000), 300);
        assert_eq!(Percentage::new(0).unwrap().of(999), 0);
        assert_eq!(Percentage::new(100).unwrap().of(42), 42);
    }

    #[test]
    fn rejects_over_100() {
        assert_eq!(
            Percentage::new(150).err(),
            Some(String::from("percentage must be 0-100, got 150"))
        );
        assert!(Percentage::new(101).is_err());
    }
}

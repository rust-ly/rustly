hints = [
  "Start with `let mut replies = Vec::new();` and `push` a `String` for each input. Return `replies` at the end.",
  "Loop with `for input in inputs`. Parse like the first concept: `match input.trim().parse::<u32>()`.",
  "On a bad input, push the message and `continue`. On a win, push \"You win!\" and `break`.",
  "`\"Too small!\".to_string()` turns text into a `String` you can push.",
]
solution = '''
use std::cmp::Ordering;

/// Plays one game against `secret` and returns the game's reply to each input it reads.
fn play(secret: u32, inputs: &[&str]) -> Vec<String> {
    let mut replies = Vec::new();
    for input in inputs {
        let guess: u32 = match input.trim().parse() {
            Ok(num) => num,
            Err(_) => {
                replies.push("Please type a number!".to_string());
                continue;
            }
        };
        match guess.cmp(&secret) {
            Ordering::Less => replies.push("Too small!".to_string()),
            Ordering::Greater => replies.push("Too big!".to_string()),
            Ordering::Equal => {
                replies.push("You win!".to_string());
                break;
            }
        }
    }
    replies
}

fn main() {
    for reply in play(42, &["50", "oops", "25\n", "42", "7"]) {
        println!("{reply}");
    }
}
'''

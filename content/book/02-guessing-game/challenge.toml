title = "Play a round"
prompt = '''
Write `play(secret, inputs)`, which plays the guessing game with a list of typed
inputs and returns what the game would print, one `String` per input it reads:

- `"Please type a number!"` if the input isn't a whole number (after trimming)
- `"Too small!"` or `"Too big!"` for a wrong guess
- `"You win!"` for the right guess, and then stop. Inputs after the winning
  guess are never read, so they get no reply.

If the inputs run out before the player wins, just return the replies so far.
'''

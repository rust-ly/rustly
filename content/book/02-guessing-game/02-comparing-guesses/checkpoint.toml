solution = '''
use std::cmp::Ordering;

/// Compares a guess with the secret number.
fn compare_guess(guess: u32, secret: u32) -> Ordering {
    guess.cmp(&secret)
}

fn main() {
    println!("{:?}", compare_guess(30, 50));
}
'''

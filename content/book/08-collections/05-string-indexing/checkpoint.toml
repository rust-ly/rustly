id = "book.collections.string-indexing.checkpoint"
kind = "checkpoint"
title = "Count letters, not bytes"
prompt = '''
These functions must work for any language, including emoji. Write:

- `char_count(s: &str) -> usize`: the number of characters (not bytes).
- `first_char(s: &str) -> Option<char>`: the first character, or `None` for `""`.
- `reverse(s: &str) -> String`: the characters in reverse order.
  `.chars().rev()` goes backwards, and you can `push` each one onto a new String.
'''
starter = '''

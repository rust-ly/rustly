'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_characters() {
        assert_eq!(char_count("hello"), 5);
        assert_eq!(char_count("Здравствуйте"), 12);
        assert_eq!(char_count("🦀🦀"), 2);
        assert_eq!(char_count(""), 0);
    }

    #[test]
    fn first_character() {
        assert_eq!(first_char("🦀 rust"), Some('🦀'));

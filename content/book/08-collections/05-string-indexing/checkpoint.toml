        assert_eq!(first_char(""), None);
    }

    #[test]
    fn reverses() {
        assert_eq!(reverse("stressed"), "desserts");
        assert_eq!(reverse("añb"), "bña");
        assert_eq!(reverse(""), "");
    }
}
'''
hints = [
  "`s.len()` counts bytes. `s.chars().count()` counts characters.",
  "`s.chars().next()` already returns an `Option<char>`.",
  "`let mut out = String::new(); for c in s.chars().rev() { out.push(c); } out`",
]
solution = '''
fn char_count(s: &str) -> usize {
    s.chars().count()
}

fn first_char(s: &str) -> Option<char> {
    s.chars().next()
}

fn reverse(s: &str) -> String {
    let mut out = String::new();
    for c in s.chars().rev() {
        out.push(c);
    }
    out
}

fn main() {
    println!("{}", char_count("Здравствуйте"));
    println!("{:?}", first_char("🦀 rust"));
    println!("{}", reverse("stressed"));
}
'''

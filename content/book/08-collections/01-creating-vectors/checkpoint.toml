'''
hints = [
  "`let mut v = Vec::new();` then `for i in 1..=n { v.push(i); }` and return `v`.",
  "`vec![\"three\", \"two\", \"one\", \"liftoff\"]`",
]
solution = '''
fn count_up(n: u32) -> Vec<u32> {
    let mut v = Vec::new();
    for i in 1..=n {
        v.push(i);
    }
    v
}

fn countdown() -> Vec<&'static str> {
    vec!["three", "two", "one", "liftoff"]
}

fn main() {
    println!("{:?}", count_up(5));
    println!("{:?}", countdown());
}
'''

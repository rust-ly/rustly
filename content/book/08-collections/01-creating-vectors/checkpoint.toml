id = "book.collections.creating-vectors.checkpoint"
kind = "checkpoint"
title = "Count up and count down"
prompt = '''
Write two functions that build vectors:

- `count_up(n: u32) -> Vec<u32>` returns `[1, 2, ..., n]`, using `Vec::new()`
  and `push` in a loop. `count_up(0)` is an empty vector.
- `countdown() -> Vec<&'static str>` returns `["three", "two", "one", "liftoff"]`,
  using the `vec!` macro.
'''
starter = '''

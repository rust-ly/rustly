    todo!()
}

fn countdown() -> Vec<&'static str> {
    todo!()
}

fn main() {
    println!("{:?}", count_up(5));
    println!("{:?}", countdown());
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_up() {
        assert_eq!(count_up(5), vec![1, 2, 3, 4, 5]);
        assert_eq!(count_up(1), vec![1]);
        assert!(count_up(0).is_empty());
    }

    #[test]
    fn counts_down() {
        assert_eq!(countdown(), vec!["three", "two", "one", "liftoff"]);
    }

Already know vectors, strings and hash maps? Pass this to complete the whole
chapter.

Write three functions:

1. `word_counts(text) -> HashMap<String, usize>`: how many times each word
   appears. Words are separated by whitespace, count in lower case, and lose any
   punctuation at either end, so `"The"`, `"the,"` and `"THE!"` all count as

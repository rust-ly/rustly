hints = [
  "`text.split_whitespace()` gives the words. `word.trim_matches(|c: char| !c.is_alphanumeric())` strips punctuation from both ends, and `.to_lowercase()` does the rest. Skip words that end up empty.",
  "`*counts.entry(word).or_insert(0) += 1` counts a word whether or not it's been seen before.",
  "For `top_words`, collect the map into a `Vec`, then `sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)))` and `truncate(n)`.",
  "For `capitalise`, take `word.chars()`, call `.next()` for the first letter and `.to_uppercase()` it, then add the rest with `chars.as_str()`. Collect the words into a `Vec` and `.join(\" \")`.",
]
solution = '''
use std::collections::HashMap;

fn word_counts(text: &str) -> HashMap<String, usize> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        let word = word.trim_matches(|c: char| !c.is_alphanumeric()).to_lowercase();
        if !word.is_empty() {
            *counts.entry(word).or_insert(0) += 1;
        }
    }
    counts
}

fn top_words(text: &str, n: usize) -> Vec<(String, usize)> {
    let mut words: Vec<(String, usize)> = word_counts(text).into_iter().collect();
    words.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));
    words.truncate(n);
    words
}

fn capitalise(text: &str) -> String {
    let mut words = Vec::new();
    for word in text.split_whitespace() {
        let mut chars = word.chars();
        if let Some(first) = chars.next() {
            let mut capitalised: String = first.to_uppercase().collect();
            capitalised.push_str(chars.as_str());
            words.push(capitalised);
        }
    }
    words.join(" ")
}

fn main() {
    let text = "The cat sat. The cat ran! A dog sat.";
    println!("{:?}", top_words(text, 3));
    println!("{}", capitalise(text));
}
'''

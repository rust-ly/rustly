hints = [
  "Start with `let mut book = HashMap::new();`, loop with `for (name, number) in entries`, and insert `name.to_string()` and `number.to_string()`.",
  "`match book.get(name) { Some(n) => n.clone(), None => String::from(\"unknown\") }`",
]
solution = '''
use std::collections::HashMap;

fn phone_book(entries: &[(&str, &str)]) -> HashMap<String, String> {
    let mut book = HashMap::new();
    for (name, number) in entries {
        book.insert(name.to_string(), number.to_string());
    }
    book
}

fn lookup(book: &HashMap<String, String>, name: &str) -> String {
    match book.get(name) {
        Some(number) => number.clone(),
        None => String::from("unknown"),
    }
}

fn main() {
    let book = phone_book(&[("Ada", "555-0100"), ("Grace", "555-0199")]);
    println!("{}", lookup(&book, "Grace"));
    println!("{}", lookup(&book, "Linus"));
}
'''

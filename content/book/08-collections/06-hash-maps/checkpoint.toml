Write two functions:

- `phone_book(entries: &[(&str, &str)]) -> HashMap<String, String>` builds a map
  from each name to its number.
- `lookup(book: &HashMap<String, String>, name: &str) -> String` returns the number,
  or `"unknown"` if the name isn't in the book.
'''

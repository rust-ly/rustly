title = "Stats and Pig Latin"
prompt = '''
Three classic exercises from the end of the Book's collections chapter:

1. `median(numbers: &[i32]) -> Option<f64>`: the middle value once the numbers are
   sorted, or the average of the two middle values when there's an even count.
   `None` for an empty slice. (Copy the numbers into a `Vec` and call `.sort()`.)
2. `mode(numbers: &[i32]) -> Option<i32>`: the value that appears most often. Use a
   `HashMap` to count. If several values tie, return the **smallest** of them.
   `None` for an empty slice.
3. `pig_latin(word: &str) -> String`: if the word starts with a vowel (a, e, i, o, u),
   add `"-hay"` to the end (`"apple"` → `"apple-hay"`). Otherwise move the first
   letter to the end and add `"ay"` (`"first"` → `"irst-fay"`). Words are lowercase
   ASCII and never empty.
'''

hints = [
  "For the median: `let mut v = numbers.to_vec(); v.sort();` then look at `v[len / 2]` (and `v[len / 2 - 1]` when `len` is even).",
  "For the mode, count with `*counts.entry(n).or_insert(0) += 1`, then loop over the map keeping the best `(count, value)` seen so far.",
  "For Pig Latin, `word.chars().next()` gives the first letter and `&word[1..]` the rest (safe here because the words are ASCII).",
]
solution = '''
use std::collections::HashMap;

fn median(numbers: &[i32]) -> Option<f64> {
    if numbers.is_empty() {
        return None;
    }
    let mut v = numbers.to_vec();
    v.sort();
    let mid = v.len() / 2;
    if v.len() % 2 == 0 {
        Some((v[mid - 1] as f64 + v[mid] as f64) / 2.0)
    } else {
        Some(v[mid] as f64)
    }
}

fn mode(numbers: &[i32]) -> Option<i32> {
    let mut counts = HashMap::new();
    for n in numbers {
        *counts.entry(*n).or_insert(0) += 1;
    }
    let mut best_value = None;
    let mut best_count = 0;
    for (value, count) in &counts {
        let better = *count > best_count;
        let tie_but_smaller = *count == best_count && Some(*value) < best_value;
        if better || tie_but_smaller {
            best_value = Some(*value);
            best_count = *count;
        }
    }
    best_value
}

fn pig_latin(word: &str) -> String {
    let first = word.chars().next().unwrap();
    if "aeiou".contains(first) {
        format!("{word}-hay")
    } else {
        format!("{}-{first}ay", &word[1..])
    }
}

fn main() {
    let data = [3, 1, 4, 1, 5, 9, 2, 6];
    println!("median {:?}, mode {:?}", median(&data), mode(&data));
    println!("{} {}", pig_latin("first"), pig_latin("apple"));
}
'''

prompt = '''
Write `letter_counts(text: &str) -> HashMap<char, u32>`, which counts how many times
each letter appears. Only count alphabetic characters (`c.is_alphabetic()`), and
count upper- and lower-case together by lowering each one first
(`c.to_ascii_lowercase()`).

Use `entry(...).or_insert(0)`.
'''

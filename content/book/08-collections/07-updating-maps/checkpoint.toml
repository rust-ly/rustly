hints = [
  "Loop with `for c in text.chars()` and skip anything where `!c.is_alphabetic()` using `continue`.",
  "`*counts.entry(c.to_ascii_lowercase()).or_insert(0) += 1;`",
]
solution = '''
use std::collections::HashMap;

fn letter_counts(text: &str) -> HashMap<char, u32> {
    let mut counts = HashMap::new();
    for c in text.chars() {
        if !c.is_alphabetic() {
            continue;
        }
        *counts.entry(c.to_ascii_lowercase()).or_insert(0) += 1;
    }
    counts
}

fn main() {
    let counts = letter_counts("Hello, World!");
    println!("l appears {} times", counts[&'l']);
}
'''

hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    const POEM: &str = "I'm nobody! Who are you?\nAre you nobody, too?\nThen there's a pair of us - don't tell!\nNobody knows.";

    fn args(list: &[&str]) -> Vec<String> {
        let mut v = Vec::new();
        for a in list {
            v.push(a.to_string());
        }
        v
    }

    #[test]
    fn numbered_matches() {
        let r = minigrep(&args(&["minigrep", "nobody", "poem.txt"]), &[("poem.txt", POEM)], None);
        assert_eq!(r, Ok(vec![
            String::from("1: I'm nobody! Who are you?"),
            String::from("2: Are you nobody, too?"),
        ]));
    }

    #[test]
    fn ignore_case() {
        let r = minigrep(&args(&["minigrep", "NOBODY", "poem.txt"]), &[("poem.txt", POEM)], Some("1"));
        assert_eq!(r.unwrap().len(), 3);
    }

    #[test]
    fn count_flag() {
        let r = minigrep(&args(&["minigrep", "o", "poem.txt", "--count"]), &[("poem.txt", POEM)], None);
        assert_eq!(r, Ok(vec![String::from("4")]));
    }

    #[test]
    fn picks_the_right_file() {
        let files = [("a.txt", "apple\nbanana"), ("b.txt", "banana bread")];
        let r = minigrep(&args(&["minigrep", "banana", "b.txt"]), &files, None);
        assert_eq!(r, Ok(vec![String::from("1: banana bread")]));
    }

    #[test]
    fn errors() {
        assert_eq!(
            minigrep(&args(&["minigrep", "x"]), &[], None),
            Err(String::from("not enough arguments"))

hints = [
  "Find the file with a loop over `files`: `for (path, text) in files { if *path == args[2] { ... } }`. Keep the contents in an `Option<&str>`.",
  "Number lines with a counter while looping over `contents.lines()`, and decide the match with `to_lowercase()` when ignoring case.",
  "`args.len() > 3 && args[3] == \"--count\"` checks for the flag.",
]
solution = '''
fn minigrep(
    args: &[String],
    files: &[(&str, &str)],
    ignore_case_var: Option<&str>,
) -> Result<Vec<String>, String> {
    if args.len() < 3 {
        return Err(String::from("not enough arguments"));
    }
    let query = &args[1];
    let path = &args[2];
    let count_only = args.len() > 3 && args[3] == "--count";
    let ignore_case = ignore_case_var.is_some();

    let mut contents = None;
    for (p, text) in files {
        if *p == path.as_str() {
            contents = Some(*text);
        }
    }
    let Some(contents) = contents else {
        return Err(format!("file not found: {path}"));
    };

    let lowered_query = query.to_lowercase();
    let mut matches = Vec::new();
    let mut number = 1;
    for line in contents.lines() {
        let hit = if ignore_case {
            line.to_lowercase().contains(&lowered_query)
        } else {
            line.contains(query.as_str())
        };
        if hit {
            matches.push(format!("{number}: {line}"));
        }
        number += 1;
    }

    if count_only {
        Ok(vec![matches.len().to_string()])
    } else {
        Ok(matches)
    }
}

fn main() {
    let poem = "I'm nobody! Who are you?\nAre you nobody, too?\nThen there's a pair of us";
    let files = [("poem.txt", poem)];
    let args = vec![String::from("minigrep"), String::from("nobody"), String::from("poem.txt")];
    match minigrep(&args, &files, None) {
        Ok(lines) => {
            for line in lines {
                println!("{line}");
            }
        }
        Err(e) => eprintln!("Application error: {e}"),
    }
}
'''

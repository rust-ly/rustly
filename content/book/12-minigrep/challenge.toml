title = "The whole minigrep"
prompt = '''
Put the chapter together into one testable program:

`minigrep(args: &[String], files: &[(&str, &str)], ignore_case_var: Option<&str>) -> Result<Vec<String>, String>`

- `args` is the argument list, like `["minigrep", "to", "poem.txt"]`. With fewer than
  three arguments, return `Err("not enough arguments")`.
- `files` stands in for the file system: a list of `(path, contents)` pairs. If the
  path isn't there, return `Err("file not found: PATH")`.
- Search the contents for the query (case-insensitively when `ignore_case_var` is
  `Some`) and return each matching line prefixed with its **line number** in the
  file: `"2: Are you nobody, too?"`.
- Optional flag: if `args` has a **fourth** argument `"--count"`, return a single
  line with the number of matches instead, like `"3"`.
'''

hints = [
  "Check `args.len() < 3` before indexing, and return `Err(\"not enough arguments\")`.",
  "Loop over `&args[3..]` and `match flag.as_str()`: `\"-i\"` sets `ignore_case`, `\"-v\"` sets `invert`, and `_` returns `Err(\"unknown flag\")`.",
  "`search` returns slices of `contents`, so it needs a lifetime: `fn search<'a>(config: &Config, contents: &'a str) -> Vec<&'a str>`.",
  "For each line, work out `matched` (lower-casing both sides when `ignore_case` is on), then keep the line when `matched != config.invert`.",
]
solution = '''
pub struct Config {
    pub query: String,
    pub file_path: String,
    pub ignore_case: bool,
    pub invert: bool,
}

impl Config {
    pub fn build(args: &[String]) -> Result<Config, &'static str> {
        if args.len() < 3 {
            return Err("not enough arguments");
        }
        let mut config = Config {
            query: args[1].clone(),
            file_path: args[2].clone(),
            ignore_case: false,
            invert: false,
        };
        for flag in &args[3..] {
            match flag.as_str() {
                "-i" => config.ignore_case = true,
                "-v" => config.invert = true,
                _ => return Err("unknown flag"),
            }
        }
        Ok(config)
    }
}

pub fn search<'a>(config: &Config, contents: &'a str) -> Vec<&'a str> {
    let query = config.query.to_lowercase();
    contents
        .lines()
        .filter(|line| {
            let matched = if config.ignore_case {
                line.to_lowercase().contains(&query)
            } else {
                line.contains(&config.query)
            };
            matched != config.invert
        })
        .collect()
}

fn main() {
    let args: Vec<String> = ["minigrep", "the", "poem.txt", "-i"].map(String::from).to_vec();
    let config = Config::build(&args).unwrap();
    let poem = "The night is dark\nand full of stars\nthe end";
    println!("Searching {} for {}:", config.file_path, config.query);
    for line in search(&config, poem) {
        println!("{line}");
    }
}
'''

title = "minigrep with flags"
prompt = '''
Already know how minigrep reads its arguments, builds a `Config` and searches?
Pass this to complete the whole chapter.

1. `Config::build(args: &[String]) -> Result<Config, &'static str>`:
   - `args[1]` is the query and `args[2]` the file path. With fewer than three
     arguments, return `Err("not enough arguments")`.
   - Any arguments after those are flags: `-i` turns on `ignore_case` and `-v`
     turns on `invert`. Any other flag is `Err("unknown flag")`.
2. `search(config, contents) -> Vec<&str>`: the lines of `contents` that contain
   the query, matching any case when `ignore_case` is on. With `invert` on, it
   returns the lines that **don't** match instead.

`Config` has public fields `query`, `file_path`, `ignore_case` and `invert`.
'''
starter = '''
pub struct Config {
    pub query: String,
    pub file_path: String,
}

impl Config {
    pub fn build(args: &[String]) -> Result<Config, &'static str> {
        let query = args[1].clone();
        let file_path = args[2].clone();
        Ok(Config { query, file_path })
    }
}

fn main() {
    let args: Vec<String> = ["minigrep", "the", "poem.txt", "-i"].map(String::from).to_vec();
    let config = Config::build(&args).unwrap();
    let poem = "The night is dark\nand full of stars\nthe end";
    for line in search(&config, poem) {
        println!("{line}");
    }
}
'''

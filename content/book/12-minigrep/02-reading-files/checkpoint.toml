hints = [
  "`contents.lines()` gives each line; count them in a loop (or with `.count()`).",
  "In `numbered`, keep a counter starting at 1 and `push(format!(\"{n}: {line}\"))`.",
]
solution = '''
fn line_count(contents: &str) -> usize {
    contents.lines().count()
}

fn numbered(contents: &str) -> Vec<String> {
    let mut out = Vec::new();
    let mut n = 1;
    for line in contents.lines() {
        out.push(format!("{n}: {line}"));
        n += 1;
    }
    out
}

fn main() {
    let poem = "I'm nobody! Who are you?\nAre you nobody, too?";
    println!("{} lines", line_count(poem));
    for line in numbered(poem) {
        println!("{line}");
    }
}
'''

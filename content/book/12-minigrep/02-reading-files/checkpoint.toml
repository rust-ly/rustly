hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_lines() {
        assert_eq!(line_count("a\nb\nc"), 3);
        assert_eq!(line_count("one line"), 1);
        assert_eq!(line_count(""), 0);
        assert_eq!(line_count("a\r\nb\r\n"), 2);
    }

    #[test]
    fn numbers_lines() {
        assert_eq!(
            numbered("I'm nobody!\nWho are you?"),

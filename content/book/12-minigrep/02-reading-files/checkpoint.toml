id = "book.minigrep.reading-files.checkpoint"
kind = "checkpoint"
title = "Number the lines"
prompt = '''
Write two functions that work on a file's contents:

- `line_count(contents: &str) -> usize`: how many lines there are (an empty string
  has 0).
- `numbered(contents: &str) -> Vec<String>`: each line prefixed with its number,
  starting at 1, like `"1: I'm nobody! Who are you?"`.
'''

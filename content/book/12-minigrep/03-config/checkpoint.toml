        );
    }
}
'''
hints = [
  "Check `if args.len() < 3 { return Err(\"not enough arguments\"); }` before touching `args[1]`.",
  "`args[1].is_empty()` tells you if the query is empty.",
]
solution = '''
#[derive(Debug, PartialEq)]
struct Config {
    query: String,
    file_path: String,
}

impl Config {
    fn build(args: &[String]) -> Result<Config, &'static str> {
        if args.len() < 3 {
            return Err("not enough arguments");
        }
        if args[1].is_empty() {
            return Err("the query can't be empty");
        }
        Ok(Config {
            query: args[1].clone(),
            file_path: args[2].clone(),
        })
    }
}

fn main() {
    let args = vec![String::from("minigrep"), String::from("frog")];
    match Config::build(&args) {
        Ok(c) => println!("{c:?}"),
        Err(e) => println!("Problem parsing arguments: {e}"),
    }
}
'''

id = "book.minigrep.config.checkpoint"
kind = "checkpoint"
title = "Config::build"
prompt = '''
Write `Config::build(args: &[String]) -> Result<Config, &'static str>`:

- With fewer than 3 arguments, return `Err("not enough arguments")`.
- If the query (`args[1]`) is empty, return `Err("the query can't be empty")`.
- Otherwise return a `Config` with `query` and `file_path` from `args[1]` and
  `args[2]`.
'''
starter = '''
#[derive(Debug, PartialEq)]
struct Config {
    query: String,
    file_path: String,
}

impl Config {
    fn build(args: &[String]) -> Result<Config, &'static str> {
        Ok(Config {
            query: args[1].clone(),
            file_path: args[2].clone(),
        })
    }
}

fn main() {
    let args = vec![String::from("minigrep"), String::from("frog")];
    match Config::build(&args) {
        Ok(c) => println!("{c:?}"),
        Err(e) => println!("Problem parsing arguments: {e}"),
    }
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn args(list: &[&str]) -> Vec<String> {
        let mut v = Vec::new();
        for a in list {
            v.push(a.to_string());
        }
        v
    }

    #[test]
    fn builds_a_config() {
        assert_eq!(
            Config::build(&args(&["minigrep", "frog", "poem.txt"])),
            Ok(Config { query: String::from("frog"), file_path: String::from("poem.txt") })
        );
    }

    #[test]
    fn too_few_arguments() {
        assert_eq!(Config::build(&args(&["minigrep", "frog"])), Err("not enough arguments"));
        assert_eq!(Config::build(&args(&["minigrep"])), Err("not enough arguments"));
        assert_eq!(Config::build(&[]), Err("not enough arguments"));
    }

    #[test]
    fn empty_query() {
        assert_eq!(
            Config::build(&args(&["minigrep", "", "poem.txt"])),

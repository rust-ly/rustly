id = "book.minigrep.run-and-errors.checkpoint"
kind = "checkpoint"
title = "Report the results"
prompt = '''
Write `run(config: &Config, contents: &str) -> Result<String, String>`, which returns
the program's whole output as one string:

- If `contents` is empty, return `Err("file is empty")`.
- Otherwise, return a line `"N match(es) for QUERY"` followed by each matching line
  (lines that contain `config.query`), each line ending with `\n`.

For example, the query `"nobody"` in `"I'm nobody!\nWho are you?\nAre you nobody, too?"`
gives `"2 match(es) for nobody\nI'm nobody!\nAre you nobody, too?\n"`.
'''

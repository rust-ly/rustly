hints = [
  "Collect the matching lines into a `Vec` first, so you know how many there are before writing the header.",
  "`let mut out = format!(\"{} match(es) for {}\\n\", matches.len(), config.query);` then `push_str` each line and a `'\\n'`.",
]
solution = '''
struct Config {
    query: String,
}

fn run(config: &Config, contents: &str) -> Result<String, String> {
    if contents.is_empty() {
        return Err(String::from("file is empty"));
    }
    let mut matches = Vec::new();
    for line in contents.lines() {
        if line.contains(&config.query) {
            matches.push(line);
        }
    }
    let mut out = format!("{} match(es) for {}\n", matches.len(), config.query);
    for line in matches {
        out.push_str(line);
        out.push('\n');
    }
    Ok(out)
}

fn main() {
    let config = Config { query: String::from("nobody") };
    let poem = "I'm nobody!\nWho are you?\nAre you nobody, too?";
    match run(&config, poem) {
        Ok(output) => print!("{output}"),
        Err(e) => eprintln!("Application error: {e}"),
    }
}
'''

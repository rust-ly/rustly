hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn copies_email_and_username() {
        let user = build_user(String::from("ada@example.com"), String::from("ada"));
        assert_eq!(user.email, "ada@example.com");
        assert_eq!(user.username, "ada");
    }

    #[test]
    fn new_users_are_active_with_one_sign_in() {

hints = [
  "Start the body with `User {` and give every field a value.",
  "Because the parameters are named `email` and `username`, you can write just `email,` and `username,` inside the braces.",
]
solution = '''
struct User {
    active: bool,
    username: String,
    email: String,
    sign_in_count: u64,
}

fn build_user(email: String, username: String) -> User {
    User {
        active: true,
        username,
        email,
        sign_in_count: 1,
    }
}

fn main() {
    let user = build_user(String::from("ada@example.com"), String::from("ada"));
    println!("{} <{}>", user.username, user.email);
}
'''

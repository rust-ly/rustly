'''
hints = [
  "`let parts: Vec<String> = self.0.iter().map(|t| format!(\"#{t}\")).collect(); write!(f, \"{}\", parts.join(\" \"))`",
  "`trait Labeled: fmt::Display { fn label(&self) -> String { format!(\"<<{}>>\", self) } }` then `impl Labeled for Tags {}`.",
  "`(<Dog as Animal>::name(), Dog::name())`",
]
solution = '''
use std::fmt;

struct Tags(Vec<String>);

impl fmt::Display for Tags {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        let parts: Vec<String> = self.0.iter().map(|t| format!("#{t}")).collect();
        write!(f, "{}", parts.join(" "))
    }
}

trait Labeled: fmt::Display {
    fn label(&self) -> String {
        format!("<<{}>>", self)
    }
}

impl Labeled for Tags {}

trait Animal {
    fn name() -> String;
}

struct Dog;

impl Dog {
    fn name() -> String {
        String::from("Spot")
    }
}

impl Animal for Dog {
    fn name() -> String {
        String::from("puppy")
    }
}

fn both_names() -> (String, String) {
    (<Dog as Animal>::name(), Dog::name())
}

fn main() {
    let t = Tags(vec![String::from("rust"), String::from("crab")]);
    println!("{t}");
    println!("{}", t.label());
    println!("{:?}", both_names());
}
'''

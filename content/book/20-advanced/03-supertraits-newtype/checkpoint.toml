id = "book.advanced.supertraits-newtype.checkpoint"
kind = "checkpoint"
title = "Labels, newtypes and supertraits"
prompt = '''
Three small tasks:

1. Make `Tags(Vec<String>)` a **newtype** that implements `Display`, showing the tags as
   `#a #b #c` (each with a `#`, separated by spaces).
2. Define a trait `Labeled: fmt::Display` with a **default** method
   `label(&self) -> String` returning `"<<VALUE>>"`, where VALUE is the `Display`
   output. Implement it (with no methods of your own) for `Tags`.
3. `both_names()` returns `(String, String)`: the result of calling `Dog`'s
   `Animal::name` and its own inherent `name`, in that order. Use fully qualified syntax
   for the trait one.
'''
starter = '''
use std::fmt;

struct Tags(Vec<String>);

trait Animal {
    fn name() -> String;
}

struct Dog;

impl Dog {
    fn name() -> String {
        String::from("Spot")
    }
}

impl Animal for Dog {
    fn name() -> String {
        String::from("puppy")
    }
}

fn both_names() -> (String, String) {
    todo!()
}

fn main() {
    let t = Tags(vec![String::from("rust"), String::from("crab")]);
    println!("{t}");
    println!("{}", t.label());
    println!("{:?}", both_names());
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn displays_tags() {
        let t = Tags(vec![String::from("a"), String::from("b"), String::from("c")]);
        assert_eq!(t.to_string(), "#a #b #c");
        assert_eq!(Tags(vec![]).to_string(), "");
    }


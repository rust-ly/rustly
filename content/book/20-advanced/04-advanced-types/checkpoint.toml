hints = [
  "`Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)`",
  "`type Readings = Vec<(String, Celsius)>;` at the top level.",
  "In `warmest`, loop and keep the best `(name, temp)` so far, comparing `temp.0`.",
  "`let n: i32 = match s.parse() { Ok(n) => n, Err(_) => continue };`",
]
solution = '''
struct Celsius(f64);
struct Fahrenheit(f64);

type Readings = Vec<(String, Celsius)>;

fn to_fahrenheit(c: Celsius) -> Fahrenheit {
    Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)
}

fn warmest(readings: &Readings) -> Option<&str> {
    let mut best: Option<(&str, f64)> = None;
    for (name, temp) in readings {
        let better = match best {
            None => true,
            Some((_, t)) => temp.0 > t,
        };
        if better {
            best = Some((name, temp.0));
        }
    }
    best.map(|(name, _)| name)
}

fn sum_valid(inputs: &[&str]) -> i32 {
    let mut total = 0;
    for s in inputs {
        let n: i32 = match s.parse() {
            Ok(n) => n,
            Err(_) => continue,
        };
        total += n;
    }
    total
}

fn main() {
    println!("{}", to_fahrenheit(Celsius(100.0)).0);
    let readings: Readings = vec![(String::from("Nairobi"), Celsius(24.0)), (String::from("Oslo"), Celsius(3.0))];
    println!("{:?}", warmest(&readings));
    println!("{}", sum_valid(&["1", "x", "41"]));
}
'''

title = "Units that can't be mixed up"
prompt = '''
Use newtypes, an alias and the never type:

- `Celsius(f64)` and `Fahrenheit(f64)` are newtypes. Write
  `to_fahrenheit(c: Celsius) -> Fahrenheit` (°F = °C × 9 / 5 + 32).
- Define the alias `type Readings = Vec<(String, Celsius)>;` and write
  `warmest(readings: &Readings) -> Option<&str>`: the name with the highest temperature.
- `sum_valid(inputs: &[&str]) -> i32`: add up the inputs that parse as `i32`, skipping
  the rest with `Err(_) => continue` inside a `match`.
'''

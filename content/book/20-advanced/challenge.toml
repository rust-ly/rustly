solution = '''
use std::fmt;
use std::ops::{Add, Mul};

#[derive(Debug, Clone, Copy, PartialEq)]
struct Cents(i64);

impl Add for Cents {
    type Output = Cents;

    fn add(self, other: Cents) -> Cents {
        Cents(self.0 + other.0)
    }
}

impl Mul<i64> for Cents {
    type Output = Cents;

    fn mul(self, qty: i64) -> Cents {
        Cents(self.0 * qty)
    }
}

impl fmt::Display for Cents {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        let sign = if self.0 < 0 { "-" } else { "" };
        let abs = self.0.abs();
        write!(f, "{sign}{}.{:02}", abs / 100, abs % 100)
    }
}

macro_rules! total {
    ( $( $x:expr ),* ) => {
        Cents(0) $( + $x )*
    };
}

type Rule = fn(Cents) -> Cents;

fn apply_rules(amount: Cents, rules: &[Rule]) -> Cents {
    rules.iter().fold(amount, |acc, rule| rule(acc))
}

fn percent_off(p: i64) -> Box<dyn Fn(Cents) -> Cents> {
    Box::new(move |c: Cents| Cents(c.0 * (100 - p) / 100))
}

fn round_down_to_shilling(c: Cents) -> Cents {
    Cents(c.0 - c.0 % 100)
}

fn main() {
    let bill = total!(Cents(250) * 2, Cents(1205));
    println!("bill: {bill}");
    println!("rounded: {}", apply_rules(bill, &[round_down_to_shilling]));
    println!("10% off: {}", percent_off(10)(bill));
}
'''

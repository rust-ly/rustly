hints = [
  "`Add`: `Cents(self.0 + other.0)`. `Mul<i64>`: `Cents(self.0 * qty)`.",
  "In `Display`, handle the sign first: `let sign = if self.0 < 0 { \"-\" } else { \"\" };`, then work with `self.0.abs()`. `{:02}` pads the cents to two digits.",
  "`total!` can expand to `Cents(0) $( + $x )*`, which uses your `Add` impl.",
  "`apply_rules` is a fold: `rules.iter().fold(amount, |acc, rule| rule(acc))`.",
  "`percent_off`: `Box::new(move |c: Cents| Cents(c.0 * (100 - p) / 100))`.",

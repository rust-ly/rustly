title = "A tiny till"
prompt = '''
Build the money side of a shop till, using this chapter's tools together:

- **Newtype + operator overloading.** `Cents(i64)` is a newtype for an amount of
  money. Implement `Add` (`Cents + Cents`) and `Mul<i64>` (`Cents * 3`, for quantities).
- **`Display` on a newtype.** Show an amount as shillings and cents with two digits:
  `Cents(1205)` is `12.05`, `Cents(7)` is `0.07` and `Cents(-340)` is `-3.40`.
- **A macro.** `total!(...)` adds zero or more `Cents` expressions. `total!()` is
  `Cents(0)`.
- **Function pointers and an alias.** With `type Rule = fn(Cents) -> Cents;`, write
  `apply_rules(amount: Cents, rules: &[Rule]) -> Cents` that applies each rule in order.
- **Returning a closure.** `percent_off(p: i64) -> Box<dyn Fn(Cents) -> Cents>` returns
  a closure that takes `p` percent off, rounding down to whole cents
  (`amount * (100 - p) / 100` in integer cents).
'''

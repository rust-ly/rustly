id = "book.advanced.test-out"
kind = "test-out"
title = "Units, labels and a macro"
prompt = '''
Already know operator overloading, newtypes, supertraits, function pointers and
`macro_rules!`? Pass this to complete the whole chapter.

1. **Newtypes and `Add`.** `Millimeters(u32)` and `Meters(u32)` are newtypes.
   Implement `Add` so that `Millimeters + Millimeters` and
   `Millimeters + Meters` both give `Millimeters`. One metre is 1000 millimetres.
2. **`Display`.** `Millimeters(1500)` prints as `1500mm`.
3. **A supertrait.** `Labelled` requires `Display` and has a default method
   `label(&self) -> String` that wraps the displayed value in brackets:
   `[1500mm]`. Implement it for `Millimeters`.
4. **Function pointers.** `apply_twice(f: fn(u32) -> u32, x: u32) -> u32` calls
   `f` on `x`, then on the result.
5. **A macro.** `largest!(a, b, c, ...)` gives the largest of one or more
   values.
'''
starter = '''
use std::fmt;
use std::ops::Add;

struct Millimeters(u32);
struct Meters(u32);

fn main() {
    let length = Millimeters(500) + Meters(1);
    println!("{length} {}", length.label());
    println!("{}", apply_twice(|x| x * 3, 2));
    println!("{}", largest!(3, 9, 4));
}
'''

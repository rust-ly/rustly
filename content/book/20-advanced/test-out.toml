hints = [
  "`impl Add for Millimeters { type Output = Millimeters; fn add(self, other: Millimeters) -> Millimeters { ... } }`. For metres, write `impl Add<Meters> for Millimeters` with `other.0 * 1000`.",
  "`impl fmt::Display for Millimeters { fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, \"{}mm\", self.0) } }`.",
  "`trait Labelled: fmt::Display { fn label(&self) -> String { format!(\"[{self}]\") } }`, then an empty `impl Labelled for Millimeters {}`.",
  "A recursive macro: `($x:expr) => { $x };` and `($x:expr, $($rest:expr),+) => {{ let a = $x; let b = largest!($($rest),+); if a > b { a } else { b } }};`. Define it above `main`.",
]
solution = '''
use std::fmt;
use std::ops::Add;

struct Millimeters(u32);
struct Meters(u32);

impl Add for Millimeters {
    type Output = Millimeters;

    fn add(self, other: Millimeters) -> Millimeters {
        Millimeters(self.0 + other.0)
    }
}

impl Add<Meters> for Millimeters {
    type Output = Millimeters;

    fn add(self, other: Meters) -> Millimeters {
        Millimeters(self.0 + other.0 * 1000)
    }
}

impl fmt::Display for Millimeters {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "{}mm", self.0)
    }
}

trait Labelled: fmt::Display {
    fn label(&self) -> String {
        format!("[{self}]")
    }
}

impl Labelled for Millimeters {}

fn apply_twice(f: fn(u32) -> u32, x: u32) -> u32 {
    f(f(x))
}

macro_rules! largest {
    ($x:expr) => {
        $x
    };
    ($x:expr, $($rest:expr),+) => {{
        let a = $x;
        let b = largest!($($rest),+);
        if a > b { a } else { b }
    }};
}

fn main() {
    let length = Millimeters(500) + Millimeters(250) + Meters(1);
    println!("{length} {}", length.label());
    println!("{}", apply_twice(|x| x * 3, 2));
    println!("{}", largest!(3, 9, 4));
}
'''

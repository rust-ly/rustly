id = "book.advanced.operator-overloading.checkpoint"
kind = "checkpoint"
title = "Vector arithmetic"
prompt = '''
Make `Vec2` support:

- `a + b` (`Add`): add the components.
- `a - b` (`Sub`): subtract the components.
- `a * 3.0` (`Mul<f64>`): scale both components by a number.
- `-a` (`Neg`): flip both signs.

All of them return a `Vec2`.
'''
starter = '''

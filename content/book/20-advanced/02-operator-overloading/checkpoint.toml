struct Vec2 {
    x: f64,
    y: f64,
}

fn main() {
    let a = Vec2 { x: 1.0, y: 2.0 };
    let b = Vec2 { x: 3.0, y: -1.0 };
    println!("{:?} {:?} {:?} {:?}", a + b, a - b, a * 2.0, -a);
}
'''

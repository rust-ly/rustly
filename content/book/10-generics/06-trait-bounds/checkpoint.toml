hints = [
  "`fn headline(item: &impl Summary) -> String { format!(\"BREAKING: {}\", item.summarize()) }`",
  "In `longest_summary`, start with `let mut best = String::new();` and replace it whenever `s.len() > best.len()`.",
]
solution = '''
trait Summary {
    fn summarize(&self) -> String;
}

struct Post {
    text: String,
}

impl Summary for Post {
    fn summarize(&self) -> String {
        self.text.clone()
    }
}

fn headline(item: &impl Summary) -> String {
    format!("BREAKING: {}", item.summarize())
}

fn longest_summary<T: Summary>(items: &[T]) -> String {
    let mut best = String::new();
    for item in items {
        let s = item.summarize();
        if s.len() > best.len() {
            best = s;
        }
    }
    best
}

fn main() {
    let posts = [Post { text: String::from("hi") }, Post { text: String::from("hello") }];
    println!("{}", headline(&posts[0]));
    println!("{}", longest_summary(&posts));
}
'''

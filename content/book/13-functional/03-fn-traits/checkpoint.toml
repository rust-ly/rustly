title = "Functions that take closures"
prompt = '''
Write two generic functions that accept closures:

- `apply_n<F: Fn(i32) -> i32>(f: F, start: i32, n: usize) -> i32` applies `f` to
  `start`, `n` times in a row. (`apply_n(|x| x * 2, 1, 3)` is 8.)
- `count_where<F: Fn(&i32) -> bool>(items: &[i32], pred: F) -> usize` counts the
  items for which `pred` returns `true`.

Also sort the `Player` list in `rank` by score, **highest first**, using
`sort_by_key`.
'''

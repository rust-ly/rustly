    #[test]
    fn counts_matching() {
        assert_eq!(count_where(&[1, 5, 8, 3], |&n| n > 2), 3);
        assert_eq!(count_where(&[2, 4, 6], |&n| n % 2 == 1), 0);
        let limit = 4;
        assert_eq!(count_where(&[1, 4, 9], |&n| n >= limit), 2);
    }

    #[test]
    fn ranks_highest_first() {
        let mut p = vec![
            Player { name: "a", score: 3 },
            Player { name: "b", score: 9 },
            Player { name: "c", score: 5 },
        ];
        rank(&mut p);
        let names: Vec<&str> = p.iter().map(|x| x.name).collect();
        assert_eq!(names, vec!["b", "c", "a"]);

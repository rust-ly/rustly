hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn applies_repeatedly() {
        assert_eq!(apply_n(|x| x * 2, 1, 3), 8);
        assert_eq!(apply_n(|x| x + 5, 0, 4), 20);
        assert_eq!(apply_n(|x| x - 1, 7, 0), 7);

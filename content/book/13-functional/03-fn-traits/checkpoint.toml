hints = [
  "`let mut value = start; for _ in 0..n { value = f(value); } value`",
  "In `count_where`, loop over `items` and add one when `pred(item)` is true.",
  "For highest first, sort by the score and then call `players.reverse()`, or sort by `std::cmp::Reverse(p.score)`.",
]
solution = '''
#[derive(Debug, PartialEq)]
struct Player {
    name: &'static str,
    score: u32,
}

fn apply_n<F: Fn(i32) -> i32>(f: F, start: i32, n: usize) -> i32 {
    let mut value = start;
    for _ in 0..n {
        value = f(value);
    }
    value
}

fn count_where<F: Fn(&i32) -> bool>(items: &[i32], pred: F) -> usize {
    let mut count = 0;
    for item in items {
        if pred(item) {
            count += 1;
        }
    }
    count
}

fn rank(players: &mut Vec<Player>) {
    players.sort_by_key(|p| p.score);
    players.reverse();
}

fn main() {
    println!("{}", apply_n(|x| x * 2, 1, 3));
    println!("{}", count_where(&[1, 5, 8, 3], |&n| n > 2));
    let mut players = vec![Player { name: "a", score: 3 }, Player { name: "b", score: 9 }];
    rank(&mut players);
    println!("{players:?}");
}
'''

title = "An iterator of your own"
prompt = '''
Implement `Iterator` for `Evens`, which produces the even numbers from `start`
(inclusive) up to `end` (exclusive). If `start` is odd, begin at the next even
number. `Evens::new(3, 10)` produces 4, 6, 8.

Then write `sum_of_evens(start: u32, end: u32) -> u32` using your iterator and
`.sum()`.
'''

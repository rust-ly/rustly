hints = [
  "`impl Iterator for Evens { type Item = u32; fn next(&mut self) -> Option<u32> { ... } }`",
  "In `next`: if `self.next >= self.end` return `None`; otherwise remember the value, add 2 to `self.next`, and return `Some(value)`.",
  "`Evens::new(start, end).sum()`",
]
solution = '''
struct Evens {
    next: u32,
    end: u32,
}

impl Evens {
    fn new(start: u32, end: u32) -> Evens {
        let next = if start % 2 == 0 { start } else { start + 1 };
        Evens { next, end }
    }
}

impl Iterator for Evens {
    type Item = u32;

    fn next(&mut self) -> Option<u32> {
        if self.next >= self.end {
            return None;
        }
        let value = self.next;
        self.next += 2;
        Some(value)
    }
}

fn sum_of_evens(start: u32, end: u32) -> u32 {
    Evens::new(start, end).sum()
}

fn main() {
    for n in Evens::new(3, 10) {
        println!("{n}");
    }
    println!("sum: {}", sum_of_evens(1, 11));
}
'''

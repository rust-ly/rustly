solution = '''
fn squares(nums: &[i32]) -> Vec<i32> {
    nums.iter().map(|n| n * n).collect()
}

fn long_words(words: &[&str], min: usize) -> Vec<String> {
    words
        .iter()
        .filter(|w| w.chars().count() >= min)
        .map(|w| w.to_string())
        .collect()
}

fn shouted(words: &[&str]) -> String {
    words.iter().map(|w| w.to_uppercase()).collect()
}

fn main() {
    println!("{:?}", squares(&[1, 2, 3]));
    println!("{:?}", long_words(&["a", "rust", "is", "great"], 4));
    println!("{}", shouted(&["hey", "you"]));
}
'''

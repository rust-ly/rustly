hints = [
  "`dot`: `a.iter().zip(b.iter()).map(|(x, y)| x * y).sum()`",
  "`all_positive`: `v.iter().all(|&x| x > 0)`",
  "`first_negative`: `v.iter().find(|&&x| x < 0).copied()`",
  "`index_of_max` can use `fold` over `v.iter().enumerate()`, keeping the best `Option<usize>` so far.",
]
solution = '''
fn index_of_max(v: &[i32]) -> Option<usize> {
    v.iter().enumerate().fold(None, |best, (i, &x)| match best {
        None => Some(i),
        Some(b) => {
            if x > v[b] { Some(i) } else { Some(b) }
        }
    })
}

fn dot(a: &[i32], b: &[i32]) -> i32 {
    a.iter().zip(b.iter()).map(|(x, y)| x * y).sum()
}

fn all_positive(v: &[i32]) -> bool {
    v.iter().all(|&x| x > 0)
}

fn first_negative(v: &[i32]) -> Option<i32> {
    v.iter().find(|&&x| x < 0).copied()
}

fn main() {
    println!("{:?}", index_of_max(&[3, 9, 2, 9]));
    println!("{}", dot(&[1, 2, 3], &[4, 5, 6]));
    println!("{}", all_positive(&[1, 2]));
    println!("{:?}", first_negative(&[4, -2, -7]));
}
'''

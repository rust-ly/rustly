id = "book.functional.more-adapters.checkpoint"
kind = "checkpoint"
title = "Replace the loops"
prompt = '''
Each function below is written with a loop. Rewrite each one as an iterator chain
(the behaviour must stay the same):

- `index_of_max(v)`: the index of the largest value (the first, on a tie), or `None`
  for an empty slice. Hint: `enumerate` and compare by value.
- `dot(a, b)`: the dot product, `a[0]*b[0] + a[1]*b[1] + ...` (stop at the shorter).
- `all_positive(v)`: whether every value is greater than 0 (`true` for empty).
- `first_negative(v)`: the first negative value, if any.

The grader only checks behaviour, so this is practice in reading and writing chains.
'''
starter = '''
fn index_of_max(v: &[i32]) -> Option<usize> {
    let mut best: Option<usize> = None;
    for i in 0..v.len() {
        let better = match best {
            None => true,
            Some(b) => v[i] > v[b],
        };
        if better {
            best = Some(i);
        }
    }
    best
}

fn dot(a: &[i32], b: &[i32]) -> i32 {
    todo!()
}

fn all_positive(v: &[i32]) -> bool {
    todo!()
}

fn first_negative(v: &[i32]) -> Option<i32> {
    todo!()
}

fn main() {
    println!("{:?}", index_of_max(&[3, 9, 2, 9]));
    println!("{}", dot(&[1, 2, 3], &[4, 5, 6]));
    println!("{}", all_positive(&[1, 2]));
    println!("{:?}", first_negative(&[4, -2, -7]));
}
'''
hidden_tests = '''

prompt = '''
A shop's inventory is a list of `Item`s. Write each function with closures and
iterator chains:

1. `in_stock(items: &[Item]) -> Vec<&str>`: names of items with `qty > 0`, in order.
2. `total_value(items: &[Item]) -> u32`: the sum of `price * qty` over all items.
3. `cheaper_than(items: &[Item], limit: u32) -> Vec<String>`: names of items whose
   price is below `limit`, sorted alphabetically.
4. `most_valuable(items: &[Item]) -> Option<&Item>`: the item with the largest
   `price * qty` (`max_by_key` exists!). `None` for an empty list.
5. `restock(items: &mut [Item], min: u32)`: raise every item's `qty` to at least
   `min`, in place (`iter_mut`).
'''

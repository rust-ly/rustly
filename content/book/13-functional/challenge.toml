solution = '''
#[derive(Debug, PartialEq)]
struct Item {
    name: String,
    price: u32,
    qty: u32,
}

fn in_stock(items: &[Item]) -> Vec<&str> {
    items.iter().filter(|i| i.qty > 0).map(|i| i.name.as_str()).collect()
}

fn total_value(items: &[Item]) -> u32 {
    items.iter().map(|i| i.price * i.qty).sum()
}

fn cheaper_than(items: &[Item], limit: u32) -> Vec<String> {
    let mut names: Vec<String> = items
        .iter()
        .filter(|i| i.price < limit)
        .map(|i| i.name.clone())
        .collect();
    names.sort();
    names
}

fn most_valuable(items: &[Item]) -> Option<&Item> {
    items.iter().max_by_key(|i| i.price * i.qty)
}

fn restock(items: &mut [Item], min: u32) {
    items.iter_mut().filter(|i| i.qty < min).for_each(|i| i.qty = min);
}

fn main() {
    let mut items = vec![
        Item { name: String::from("pen"), price: 2, qty: 10 },
        Item { name: String::from("book"), price: 15, qty: 0 },
        Item { name: String::from("lamp"), price: 30, qty: 2 },
    ];
    println!("{:?}", in_stock(&items));
    println!("{}", total_value(&items));
    println!("{:?}", cheaper_than(&items, 20));
    println!("{:?}", most_valuable(&items).map(|i| &i.name));
    restock(&mut items, 3);
    println!("{items:?}");
}
'''

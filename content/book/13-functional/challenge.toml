  "Collect the cheap names into a `Vec<String>`, then call `.sort()` on it before returning.",
  "`items.iter().max_by_key(|i| i.price * i.qty)`, and for restocking: `for i in items.iter_mut() { if i.qty < min { i.qty = min; } }` (or `.for_each`).",

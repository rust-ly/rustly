id = "book.functional.minigrep-iterators.checkpoint"
kind = "checkpoint"
title = "minigrep, the iterator way"
prompt = '''
Rewrite minigrep's pieces with iterators:

- `Config::build(mut args: impl Iterator<Item = String>) -> Result<Config, &'static str>`
  skips the program name and takes the query and file path with `next()`. A missing
  query is `Err("Didn't get a query string")`; a missing path is
  `Err("Didn't get a file path")`. No indexing and no `clone`.
- `search_case_insensitive<'a>(query: &str, contents: &'a str) -> Vec<&'a str>` as
  a single chain using `filter`.
'''
starter = '''
#[derive(Debug, PartialEq)]
struct Config {
    query: String,
    file_path: String,
}

impl Config {
    fn build(args: &[String]) -> Result<Config, &'static str> {
        if args.len() < 3 {
            return Err("not enough arguments");
        }
        Ok(Config { query: args[1].clone(), file_path: args[2].clone() })
    }
}

fn search_case_insensitive<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
    let query = query.to_lowercase();
    let mut results = Vec::new();
    for line in contents.lines() {
        if line.to_lowercase().contains(&query) {
            results.push(line);
        }
    }
    results
}

fn main() {
    let args = vec![String::from("minigrep"), String::from("rUsT"), String::from("poem.txt")];
    let config = Config::build(args.into_iter()).unwrap();
    println!("{:?}", search_case_insensitive(&config.query, "Rust:\nTrust me.\nNope."));
}
'''

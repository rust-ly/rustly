hints = [
  "Start `build` with `args.next();` to skip the program name.",
  "`let Some(query) = args.next() else { return Err(\"Didn't get a query string\"); };`",
  "`contents.lines().filter(|line| line.to_lowercase().contains(&query)).collect()` after lower-casing the query.",
]
solution = '''
#[derive(Debug, PartialEq)]
struct Config {
    query: String,
    file_path: String,
}

impl Config {
    fn build(mut args: impl Iterator<Item = String>) -> Result<Config, &'static str> {
        args.next();
        let Some(query) = args.next() else {
            return Err("Didn't get a query string");
        };
        let Some(file_path) = args.next() else {
            return Err("Didn't get a file path");
        };
        Ok(Config { query, file_path })
    }
}

fn search_case_insensitive<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
    let query = query.to_lowercase();
    contents
        .lines()
        .filter(|line| line.to_lowercase().contains(&query))
        .collect()
}

fn main() {
    let args = vec![String::from("minigrep"), String::from("rUsT"), String::from("poem.txt")];
    let config = Config::build(args.into_iter()).unwrap();
    println!("{:?}", search_case_insensitive(&config.query, "Rust:\nTrust me.\nNope."));
}
'''

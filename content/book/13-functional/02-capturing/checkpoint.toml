title = "A tally and a greeter"
prompt = '''
Write two functions:

- `tally(words: &[&str]) -> usize` counts the words longer than 3 characters. Use a
  `mut` closure called `count_if_long` that captures a `count` variable mutably and
  adds one when its argument is long enough; call it for every word.
- `make_greeting(name: String) -> String` creates a `move` closure that captures
  `name` and returns `"Welcome, NAME!"`, then calls it and returns the result.
'''

hints = [
  "`let mut count = 0; let mut count_if_long = |w: &str| if w.len() > 3 { count += 1; };`",
  "Call it in a loop, then return `count` after the loop (when the closure's borrow has ended).",
  "`let greet = move || format!(\"Welcome, {name}!\"); greet()`",
]
solution = '''
fn tally(words: &[&str]) -> usize {
    let mut count = 0;
    let mut count_if_long = |w: &str| {
        if w.len() > 3 {
            count += 1;
        }
    };
    for w in words {
        count_if_long(w);
    }
    count
}

fn make_greeting(name: String) -> String {
    let greet = move || format!("Welcome, {name}!");
    greet()
}

fn main() {
    println!("{}", tally(&["a", "rust", "is", "great"]));
    println!("{}", make_greeting(String::from("Ferris")));
}
'''

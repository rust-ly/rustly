hints = [
  "Start with `let Point { x, y } = p;`, then `match (x, y) { (0, 0) => \"origin\", (_, 0) => ..., (0, _) => ..., ... }`.",
  "For the quadrants, compare signs: `if x > 0 && y > 0 { \"Q1\" } ...` inside the last arm is fine.",
  "`Event::Resize(Size { w, h }) => format!(\"resize to {w}x{h}\")`",
]
solution = '''
struct Point {
    x: i32,
    y: i32,
}

struct Size {
    w: u32,
    h: u32,
}

enum Event {
    Click { x: i32, y: i32 },
    Key(char),
    Resize(Size),
}

fn quadrant(p: Point) -> &'static str {
    let Point { x, y } = p;
    match (x, y) {
        (0, 0) => "origin",
        (_, 0) => "x axis",
        (0, _) => "y axis",
        _ => {
            if x > 0 && y > 0 {
                "Q1"
            } else if x < 0 && y > 0 {
                "Q2"
            } else if x < 0 {
                "Q3"
            } else {
                "Q4"
            }
        }
    }
}

fn describe(e: Event) -> String {
    match e {
        Event::Click { x, y } => format!("click at {x},{y}"),
        Event::Key(c) => format!("key {c}"),
        Event::Resize(Size { w, h }) => format!("resize to {w}x{h}"),
    }
}

fn main() {
    println!("{}", quadrant(Point { x: -2, y: 5 }));
    println!("{}", describe(Event::Resize(Size { w: 800, h: 600 })));
}
'''

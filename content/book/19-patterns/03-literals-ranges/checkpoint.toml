title = "Grades and characters"
prompt = '''
Write each function as a single `match` using literals, `|` and ranges:

- `grade(score: u8) -> char`: 90–100 is `'A'`, 80–89 `'B'`, 70–79 `'C'`, 60–69 `'D'`,
  0–59 `'F'`. Anything over 100 is `'?'`.
- `is_vowel(c: char) -> bool`: true for a, e, i, o, u in either case.
- `season(month: u8) -> &'static str`: 12, 1, 2 → `"summer"`; 3–5 → `"autumn"`;
  6–8 → `"winter"`; 9–11 → `"spring"` (southern hemisphere); anything else → `"invalid"`.
'''

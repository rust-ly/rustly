hints = [
  "`match score { 90..=100 => 'A', 80..=89 => 'B', ... , _ => '?' }`",
  "`match c { 'a' | 'e' | 'i' | 'o' | 'u' | 'A' | 'E' | 'I' | 'O' | 'U' => true, _ => false }`",
  "`12 | 1 | 2 => \"summer\"`",
]
solution = '''
fn grade(score: u8) -> char {
    match score {
        90..=100 => 'A',
        80..=89 => 'B',
        70..=79 => 'C',
        60..=69 => 'D',
        0..=59 => 'F',
        _ => '?',
    }
}

fn is_vowel(c: char) -> bool {
    match c {
        'a' | 'e' | 'i' | 'o' | 'u' | 'A' | 'E' | 'I' | 'O' | 'U' => true,
        _ => false,
    }
}

fn season(month: u8) -> &'static str {
    match month {
        12 | 1 | 2 => "summer",
        3..=5 => "autumn",
        6..=8 => "winter",
        9..=11 => "spring",
        _ => "invalid",
    }
}

fn main() {
    println!("{} {} {}", grade(95), is_vowel('E'), season(7));
}
'''

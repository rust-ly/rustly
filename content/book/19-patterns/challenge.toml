hints = [
  "Keep `let mut robot = Robot { pos: Point { x: 0, y: 0 }, facing: Facing::North, battery: 10 };` and loop over the commands.",
  "`Command::Move { steps } if steps <= robot.battery => { ... }` then a later `Command::Move { .. } => {}` skips the rest.",
  "`Command::Charge(amount @ 1..=5) => robot.battery += amount`, and `Command::Teleport(Point { x, y }) if (-5..=5).contains(&x) && (-5..=5).contains(&y) && robot.battery >= 3 => ...`",
  "A helper `fn turn(f: Facing, d: Dir) -> Facing` with a `match (f, d)` keeps the main match short.",
]
solution = '''
#[derive(Debug, Clone, Copy, PartialEq)]
enum Facing { North, East, South, West }

#[derive(Debug, Clone, Copy)]
enum Dir { Left, Right }

#[derive(Debug, Clone, Copy, PartialEq)]
struct Point { x: i32, y: i32 }

#[derive(Debug, Clone, Copy)]
enum Command {
    Move { steps: u32 },
    Turn(Dir),
    Charge(u32),
    Teleport(Point),
}

#[derive(Debug, PartialEq)]
struct Robot {
    pos: Point,
    facing: Facing,
    battery: u32,
}

fn turn(f: Facing, d: Dir) -> Facing {
    match (f, d) {
        (Facing::North, Dir::Right) | (Facing::South, Dir::Left) => Facing::East,
        (Facing::East, Dir::Right) | (Facing::West, Dir::Left) => Facing::South,
        (Facing::South, Dir::Right) | (Facing::North, Dir::Left) => Facing::West,
        (Facing::West, Dir::Right) | (Facing::East, Dir::Left) => Facing::North,
    }
}

fn run(commands: &[Command]) -> Robot {
    let mut robot = Robot { pos: Point { x: 0, y: 0 }, facing: Facing::North, battery: 10 };
    for &command in commands {
        match command {
            Command::Move { steps } if steps <= robot.battery => {
                let n = steps as i32;
                match robot.facing {
                    Facing::North => robot.pos.y += n,
                    Facing::East => robot.pos.x += n,
                    Facing::South => robot.pos.y -= n,
                    Facing::West => robot.pos.x -= n,
                }
                robot.battery -= steps;
            }
            Command::Move { .. } => {}
            Command::Turn(d) => robot.facing = turn(robot.facing, d),
            Command::Charge(amount @ 1..=5) => robot.battery += amount,
            Command::Charge(_) => {}
            Command::Teleport(Point { x, y })
                if (-5..=5).contains(&x) && (-5..=5).contains(&y) && robot.battery >= 3 =>
            {
                robot.pos = Point { x, y };
                robot.battery -= 3;
            }
            Command::Teleport(_) => {}
        }
    }
    robot
}

fn main() {
    let robot = run(&[
        Command::Move { steps: 3 },
        Command::Turn(Dir::Right),
        Command::Move { steps: 2 },
        Command::Charge(4),
        Command::Teleport(Point { x: -5, y: 5 }),
    ]);
    println!("{robot:?}");
}
'''

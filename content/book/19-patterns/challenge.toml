hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn at(x: i32, y: i32) -> Point { Point { x, y } }

    #[test]
    fn moves_and_turns() {
        let r = run(&[Command::Move { steps: 3 }, Command::Turn(Dir::Right), Command::Move { steps: 2 }]);
        assert_eq!(r, Robot { pos: at(2, 3), facing: Facing::East, battery: 5 });
        let r = run(&[Command::Turn(Dir::Left), Command::Turn(Dir::Left), Command::Move { steps: 1 }]);
        assert_eq!(r.pos, at(0, -1));
        assert_eq!(r.facing, Facing::South);
    }

    #[test]
    fn skips_moves_without_battery() {
        let r = run(&[Command::Move { steps: 11 }, Command::Move { steps: 10 }, Command::Move { steps: 1 }]);
        assert_eq!(r.pos, at(0, 10));
        assert_eq!(r.battery, 0);
    }

    #[test]
    fn charging_rules() {
        let r = run(&[Command::Charge(5), Command::Charge(6), Command::Charge(0)]);
        assert_eq!(r.battery, 15);
    }

    #[test]
    fn teleport_rules() {
        let r = run(&[Command::Teleport(at(-5, 5))]);
        assert_eq!((r.pos, r.battery), (at(-5, 5), 7));
        let r = run(&[Command::Teleport(at(6, 0))]);
        assert_eq!((r.pos, r.battery), (at(0, 0), 10));
        let r = run(&[Command::Move { steps: 8 }, Command::Teleport(at(1, 1))]);
        assert_eq!((r.pos, r.battery), (at(0, 8), 2));
    }
}

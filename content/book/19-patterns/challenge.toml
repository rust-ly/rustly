id = "book.patterns.challenge"
kind = "challenge"
title = "A command interpreter"
prompt = '''
A tiny robot understands commands. Write `run(commands: &[Command]) -> Robot` that
starts a `Robot` at `(0, 0)` facing north with 10 battery, and applies each command
with **one `match`** that uses destructuring, guards and `@` bindings:

- `Move { steps }`: moves that many steps in the current direction and uses one
  battery per step. If there isn't enough battery, the move is **skipped**.
- `Turn(Dir::Left)` / `Turn(Dir::Right)`: turns 90°. Turning is free.
- `Charge(amount)`: amounts from 1 to 5 add to the battery; any other amount is
  ignored. (Use `amount @ 1..=5`.)
- `Teleport(Point { x, y })`: only allowed when **both** coordinates are between -5 and
  5 (inclusive); it costs 3 battery and is skipped if the battery is below 3 or the
  target is out of range.

North is `y + 1`, east is `x + 1`, south is `y - 1` and west is `x - 1`.
'''

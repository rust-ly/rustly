solution = '''
struct User {
    name: String,
    age: u32,
    email: Option<String>,
    admin: bool,
}

fn ends(t: (i32, i32, i32, i32, i32)) -> (i32, i32) {
    let (first, .., last) = t;
    (first, last)
}

fn name_of(user: &User) -> &str {
    let User { name, .. } = user;
    name
}

fn count_with_email(users: &[User]) -> usize {
    let mut count = 0;
    for u in users {
        if let User { email: Some(_), .. } = u {
            count += 1;
        }
    }
    count
}

fn main() {
    println!("{:?}", ends((1, 2, 3, 4, 5)));
    let users = [User { name: String::from("Ada"), age: 36, email: None, admin: true }];
    println!("{} {}", name_of(&users[0]), count_with_email(&users));
}
'''

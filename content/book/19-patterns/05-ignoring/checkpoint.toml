prompt = '''
Use `_` and `..` to pick out just the parts you need:

- `ends(t: (i32, i32, i32, i32, i32)) -> (i32, i32)`: the first and last items (`..`).
- `name_of(user: &User) -> &str`: the user's name, via a struct pattern with `..`.
- `count_with_email(users: &[User]) -> usize`: how many users have `email: Some(_)`.
'''

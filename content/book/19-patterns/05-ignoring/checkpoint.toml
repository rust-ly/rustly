hints = [
  "`let (first, .., last) = t; (first, last)`",
  "`let User { name, .. } = user; name`",
  "`users.iter().filter(|u| matches!(u, User { email: Some(_), .. })).count()`, or a loop with `if let User { email: Some(_), .. } = u`.",

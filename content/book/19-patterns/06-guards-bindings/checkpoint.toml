hints = [
  "`n if n < 0 => format!(\"negative {n}\")` handles negatives with a guard.",
  "`d @ 1..=9 => format!(\"digit {d}\")`",
  "`Some(s) if s <= limit => \"fits\"`, then `Some(_) => \"too big\"` and `None => \"unknown\"`.",
]
solution = '''
fn classify(n: i32) -> String {
    match n {
        n if n < 0 => format!("negative {n}"),
        0 => String::from("zero"),
        d @ 1..=9 => format!("digit {d}"),
        n if n % 2 == 0 => format!("big even {n}"),
        n => format!("big odd {n}"),
    }
}

fn fits(size: Option<u32>, limit: u32) -> &'static str {
    match size {
        Some(s) if s <= limit => "fits",
        Some(_) => "too big",
        None => "unknown",
    }
}

fn main() {
    println!("{} | {}", classify(7), classify(42));
    println!("{}", fits(Some(3), 5));
}
'''

id = "book.patterns.guards-bindings.checkpoint"
kind = "checkpoint"
title = "Guards and bindings"
prompt = '''
Write each function with one `match`, using guards and `@`:

- `classify(n: i32) -> String`: negative numbers → `"negative N"`; `0` → `"zero"`;
  1–9 → `"digit N"` (use `@` to bind the value); even numbers 10 or more →
  `"big even N"` (guard); everything else → `"big odd N"`.
- `fits(size: Option<u32>, limit: u32) -> &'static str`: `"fits"` when the size is
  `Some(s)` with `s <= limit` (guard), `"too big"` for any other `Some`, `"unknown"`
  for `None`.
'''
starter = '''

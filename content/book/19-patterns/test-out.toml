hints = [
  "Order matters in `where_is`: match `(0, 0)` first, then `(_, 0)` and `(0, _)`, then `(x, y) if x == y`, then `_`.",
  "Inclusive ranges work as patterns: `0..=12 => \"child\"`. The last arm can be `65..` or `_`.",
  "Slice patterns: `[] => None`, `[only] => Some((*only, *only))`, and `[first, .., last] => Some((*first, *last))`.",
  "`Ticket::Seat { row: r @ 1..=3, number }` binds the row while checking its range. Put it before `Ticket::Seat { number: 0, .. }`, since front-row seat 0 is still a front-row ticket.",
]
solution = '''
enum Ticket {
    Seat { row: u32, number: u32 },
}

fn where_is(point: (i32, i32)) -> &'static str {
    match point {
        (0, 0) => "origin",
        (_, 0) => "on the x axis",
        (0, _) => "on the y axis",
        (x, y) if x == y => "on the diagonal",
        _ => "somewhere else",
    }
}

fn age_group(age: u32) -> &'static str {
    match age {
        0..=12 => "child",
        13..=19 => "teen",
        20..=64 => "adult",
        65.. => "senior",
    }
}

fn ends(numbers: &[i32]) -> Option<(i32, i32)> {
    match numbers {
        [] => None,
        [only] => Some((*only, *only)),
        [first, .., last] => Some((*first, *last)),
    }
}

fn ticket(ticket: &Ticket) -> String {
    match ticket {
        Ticket::Seat { row: r @ 1..=3, number } => format!("front row {r}, seat {number}"),
        Ticket::Seat { number: 0, .. } => "standing".to_string(),
        Ticket::Seat { row, number } => format!("row {row}, seat {number}"),
    }
}

fn main() {
    println!("{}", where_is((3, 3)));
    println!("{}", age_group(15));
    println!("{:?}", ends(&[4, 8, 15]));
    println!("{}", ticket(&Ticket::Seat { row: 2, number: 7 }));
}
'''

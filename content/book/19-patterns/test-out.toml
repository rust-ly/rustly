title = "Pattern drills"
prompt = '''
Already know destructuring, ranges, guards and `@` bindings? Pass this to
complete the whole chapter. Write each function with a `match`:

1. `where_is((x, y))`: `"origin"` for `(0, 0)`, `"on the x axis"` when `y` is 0,
   `"on the y axis"` when `x` is 0, `"on the diagonal"` when `x == y`, and
   `"somewhere else"` otherwise.
2. `age_group(age)`: `"child"` for 0 to 12, `"teen"` for 13 to 19, `"adult"` for
   20 to 64 and `"senior"` from 65 up.
3. `ends(numbers) -> Option<(i32, i32)>`: the first and last numbers of a slice,
   `None` for an empty slice. A slice of one number gives that number twice.
4. `ticket(&Ticket) -> String` for `Ticket::Seat { row, number }`:
   - rows 1 to 3 are `"front row R, seat N"`, using `@` to bind the row
   - seat 0 in any other row is `"standing"`
   - any other seat is `"row R, seat N"`
'''

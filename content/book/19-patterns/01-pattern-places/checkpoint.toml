hints = [
  "`fn swap((a, b): (i32, i32)) -> (i32, i32) { (b, a) }`",
  "`for (a, b) in pairs { total += a + b; }`: `a` and `b` are `&i32` here, which `+=` accepts.",
  "`while let Some(top) = stack.pop() { total += top; }`",
]
solution = '''
fn swap((a, b): (i32, i32)) -> (i32, i32) {
    (b, a)
}

fn sum_pairs(pairs: &[(i32, i32)]) -> i32 {
    let mut total = 0;
    for (a, b) in pairs {
        total += a + b;
    }
    total
}

fn drain_stack(mut stack: Vec<i32>) -> i32 {
    let mut total = 0;
    while let Some(top) = stack.pop() {
        total += top;
    }
    total
}

fn main() {
    println!("{:?}", swap((1, 2)));
    println!("{}", sum_pairs(&[(1, 2), (3, 4)]));
    println!("{}", drain_stack(vec![5, 6, 7]));
}
'''

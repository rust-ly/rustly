title = "Patterns everywhere"
prompt = '''
Use a pattern in each place:

- `swap((a, b): (i32, i32)) -> (i32, i32)`: unpack the tuple **in the parameter**, and
  return it swapped.
- `sum_pairs(pairs: &[(i32, i32)]) -> i32`: add up both numbers of every pair, using a
  `for (a, b) in ...` loop.
- `drain_stack(mut stack: Vec<i32>) -> i32`: pop values with `while let Some(top) = ...`
  and return their sum.
'''

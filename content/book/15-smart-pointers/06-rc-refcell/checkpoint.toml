Several family members share one basket: `Basket` is a `Rc<RefCell<Vec<String>>>`.
(`type Basket = ...;` just gives that long type a short name; chapter 20 covers it.)

- `Person::new(name: &str, basket: &Basket) -> Person` keeps a **shared** handle to
  the basket.
- `Person::add(&self, item: &str)` adds `"ITEM (NAME)"` to the shared basket.
- `items(basket: &Basket) -> Vec<String>` returns a copy of everything in it.

Note that `add` takes `&self`, not `&mut self`.
'''

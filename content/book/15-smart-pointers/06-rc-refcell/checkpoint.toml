solution = '''
use std::cell::RefCell;
use std::rc::Rc;

type Basket = Rc<RefCell<Vec<String>>>;

struct Person {
    name: String,
    basket: Basket,
}

impl Person {
    fn new(name: &str, basket: &Basket) -> Person {
        Person { name: name.to_string(), basket: Rc::clone(basket) }
    }

    fn add(&self, item: &str) {
        self.basket.borrow_mut().push(format!("{item} ({})", self.name));
    }
}

fn items(basket: &Basket) -> Vec<String> {
    basket.borrow().clone()
}

fn main() {
    let basket: Basket = Rc::new(RefCell::new(Vec::new()));
    let ada = Person::new("Ada", &basket);
    let grace = Person::new("Grace", &basket);
    ada.add("bread");
    grace.add("milk");
    println!("{:?}", items(&basket));
}
'''

title = "A list and a drop log"
prompt = '''
Already know `Box`, `Drop`, `Rc` and `RefCell`? Pass this to complete the whole
chapter.

1. `List` is the cons list from the chapter: `Cons(i32, Box<List>)` or `Nil`.
   Give it:
   - `List::from_slice(&[i32]) -> List`, so `[1, 2]` becomes
     `Cons(1, Box::new(Cons(2, Box::new(Nil))))`
   - `sum(&self) -> i32` and `len(&self) -> usize`
2. `Log` is a shared, changeable list of messages:
   `type Log = Rc<RefCell<Vec<String>>>;`
3. `Noisy::new(name, &log)` keeps its own handle to the log. When a `Noisy` is
   dropped, it adds `"dropped NAME"` to the log.
'''
starter = '''
use std::cell::RefCell;
use std::rc::Rc;

type Log = Rc<RefCell<Vec<String>>>;

enum List {
    Cons(i32, List),
    Nil,
}

fn main() {
    let list = List::from_slice(&[1, 2, 3]);
    println!("{} items adding up to {}", list.len(), list.sum());

    let log: Log = Rc::new(RefCell::new(Vec::new()));
    {
        let _a = Noisy::new("a", &log);
        let _b = Noisy::new("b", &log);
    }
    println!("{:?}", log.borrow());
}
'''

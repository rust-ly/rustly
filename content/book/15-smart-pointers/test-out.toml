hints = [
  "A recursive type needs a known size, so the rest of the list goes in a `Box`: `Cons(i32, Box<List>)`.",
  "`from_slice` can be recursive: `match items { [] => Nil, [first, rest @ ..] => Cons(*first, Box::new(List::from_slice(rest))) }`. Bring the variants in with `use List::{Cons, Nil};`.",
  "`Noisy` holds `name: String` and `log: Log`. In `new`, `Rc::clone(log)` gives it its own handle.",
  "`impl Drop for Noisy { fn drop(&mut self) { ... } }` and inside, `self.log.borrow_mut().push(format!(\"dropped {}\", self.name))`.",
]
solution = '''
use std::cell::RefCell;
use std::rc::Rc;

type Log = Rc<RefCell<Vec<String>>>;

enum List {
    Cons(i32, Box<List>),
    Nil,
}

use List::{Cons, Nil};

impl List {
    fn from_slice(items: &[i32]) -> List {
        match items {
            [] => Nil,
            [first, rest @ ..] => Cons(*first, Box::new(List::from_slice(rest))),
        }
    }

    fn sum(&self) -> i32 {
        match self {
            Cons(value, rest) => value + rest.sum(),
            Nil => 0,
        }
    }

    fn len(&self) -> usize {
        match self {
            Cons(_, rest) => 1 + rest.len(),
            Nil => 0,
        }
    }
}

struct Noisy {
    name: String,
    log: Log,
}

impl Noisy {
    fn new(name: &str, log: &Log) -> Noisy {
        Noisy {
            name: name.to_string(),
            log: Rc::clone(log),
        }
    }
}

impl Drop for Noisy {
    fn drop(&mut self) {
        self.log.borrow_mut().push(format!("dropped {}", self.name));
    }
}

fn main() {
    let list = List::from_slice(&[1, 2, 3]);
    println!("{} items adding up to {}", list.len(), list.sum());

    let log: Log = Rc::new(RefCell::new(Vec::new()));
    {
        let _a = Noisy::new("a", &log);
        let _b = Noisy::new("b", &log);
    }
    println!("{:?}", log.borrow());
}
'''

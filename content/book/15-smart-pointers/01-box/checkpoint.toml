hints = [
  "`len`: `match list { Cons(_, rest) => 1 + len(rest), Nil => 0 }`",
  "`max`: for `Cons(v, rest)`, compare `*v` with `max(rest)`, which is an `Option`.",
  "`from_slice`: if the slice is empty return `Nil`, otherwise `Cons(values[0], Box::new(from_slice(&values[1..])))`.",
]
solution = '''
#[derive(Debug, PartialEq)]
enum List {
    Cons(i32, Box<List>),
    Nil,
}

use List::{Cons, Nil};

fn len(list: &List) -> usize {
    match list {
        Cons(_, rest) => 1 + len(rest),
        Nil => 0,
    }
}

fn max(list: &List) -> Option<i32> {
    match list {
        Cons(v, rest) => match max(rest) {
            Some(m) => Some(if m > *v { m } else { *v }),
            None => Some(*v),
        },
        Nil => None,
    }
}

fn from_slice(values: &[i32]) -> List {
    if values.is_empty() {
        Nil
    } else {
        Cons(values[0], Box::new(from_slice(&values[1..])))
    }
}

fn main() {
    let list = from_slice(&[3, 9, 4]);
    println!("{list:?}");
    println!("len {}, max {:?}", len(&list), max(&list));
}
'''

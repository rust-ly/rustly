title = "A boxed linked list"
prompt = '''
Using the boxed cons list, write three recursive functions:

- `len(list: &List) -> usize`: how many values are in the list.
- `max(list: &List) -> Option<i32>`: the largest value, or `None` for `Nil`.
- `from_slice(values: &[i32]) -> List`: builds a list with the values in the same
  order. (`from_slice(&[1, 2])` is `Cons(1, Box::new(Cons(2, Box::new(Nil))))`.)
'''

    #[test]
    fn parents_are_weak() {
        let child = folder("child");
        assert_eq!(parent_name(&child), None);
        {
            let parent = folder("parent");
            add_child(&parent, &child);
            assert_eq!(parent_name(&child), Some(String::from("parent")));
            assert_eq!(Rc::strong_count(&parent), 1);
            assert_eq!(Rc::weak_count(&parent), 1);
        }
        assert_eq!(parent_name(&child), None);
    }
}

hints = [
  "`parent.children.borrow_mut().push(Rc::clone(child));` and `*child.parent.borrow_mut() = Rc::downgrade(parent);`",
  "`parent_name`: `folder.parent.borrow().upgrade().map(|p| p.name.clone())`",
  "`path`: start with the folder's name; while `upgrade()` gives a parent, put its name in front with `/`, and move up.",
]
solution = '''
use std::cell::RefCell;
use std::rc::{Rc, Weak};

struct Folder {
    name: String,
    parent: RefCell<Weak<Folder>>,
    children: RefCell<Vec<Rc<Folder>>>,
}

fn folder(name: &str) -> Rc<Folder> {
    Rc::new(Folder {
        name: name.to_string(),
        parent: RefCell::new(Weak::new()),
        children: RefCell::new(vec![]),
    })
}

fn add_child(parent: &Rc<Folder>, child: &Rc<Folder>) {
    parent.children.borrow_mut().push(Rc::clone(child));
    *child.parent.borrow_mut() = Rc::downgrade(parent);
}

fn path(folder: &Rc<Folder>) -> String {
    let mut parts = vec![folder.name.clone()];
    let mut current = folder.parent.borrow().upgrade();
    loop {
        let Some(p) = current else {
            break;
        };
        parts.push(p.name.clone());
        current = p.parent.borrow().upgrade();
    }
    parts.reverse();
    parts.join("/")
}

fn parent_name(folder: &Folder) -> Option<String> {
    folder.parent.borrow().upgrade().map(|p| p.name.clone())
}

fn main() {
    let home = folder("home");
    let ada = folder("ada");
    let docs = folder("docs");
    add_child(&home, &ada);
    add_child(&ada, &docs);
    println!("{}", path(&docs));
    println!("{:?}", parent_name(&docs));
}
'''

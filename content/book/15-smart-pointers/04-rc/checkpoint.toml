solution = '''
use std::rc::Rc;

struct Song {
    title: String,
    seconds: u32,
}

struct Playlist {
    songs: Vec<Rc<Song>>,
}

impl Playlist {
    fn add(&mut self, song: &Rc<Song>) {
        self.songs.push(Rc::clone(song));
    }

    fn total_seconds(&self) -> u32 {
        self.songs.iter().map(|s| s.seconds).sum()
    }
}

fn owners(song: &Rc<Song>) -> usize {
    Rc::strong_count(song)
}

fn main() {
    let song = Rc::new(Song { title: String::from("Crab Rave"), seconds: 180 });
    let mut morning = Playlist { songs: vec![] };
    let mut gym = Playlist { songs: vec![] };
    morning.add(&song);
    gym.add(&song);
    println!("{} has {} owners", song.title, owners(&song));
    println!("gym lasts {}s", gym.total_seconds());
}
'''

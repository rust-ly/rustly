title = "Shared playlists"
prompt = '''
Songs are shared between playlists with `Rc<Song>`, so a song isn't copied for every
playlist it's in. Write:

- `Playlist::add(&mut self, song: &Rc<Song>)`: adds a **shared** reference to the
  song (use `Rc::clone`), not a copy.
- `Playlist::total_seconds(&self) -> u32`: the sum of the songs' lengths.
- `owners(song: &Rc<Song>) -> usize`: how many `Rc`s currently point at the song
  (`Rc::strong_count`).
'''

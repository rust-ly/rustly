hints = [
  "`impl<T> Deref for Labelled<T> { type Target = T; fn deref(&self) -> &T { &self.value } }`",
  "`shout`: `format!(\"{}!\", text.to_uppercase())`.",
]
solution = '''
use std::ops::Deref;

struct Labelled<T> {
    label: &'static str,
    value: T,
}

impl<T> Deref for Labelled<T> {
    type Target = T;

    fn deref(&self) -> &T {
        &self.value
    }
}

fn shout(text: &str) -> String {
    format!("{}!", text.to_uppercase())
}

fn main() {
    let name = Labelled { label: "name", value: String::from("ferris") };
    println!("{}: {} ({} letters)", name.label, *name, name.len());
    println!("{}", shout(&name));
}
'''

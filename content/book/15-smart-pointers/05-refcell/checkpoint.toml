id = "book.smart-pointers.refcell.checkpoint"
kind = "checkpoint"
title = "Test the LimitTracker with a mock"
prompt = '''
Two parts:

1. Finish `MockMessenger`: implement `Messenger` for it so `send` records each message
   in `sent_messages` (a `RefCell<Vec<String>>`).
2. Finish `LimitTracker::set_value`. It sets `self.value`, then sends **one** message
   based on the percentage of `max` used:
   - 100% or more: `"Error: You are over your quota!"`
   - 90% or more: `"Urgent warning: You've used up over 90% of your quota!"`
   - 75% or more: `"Warning: You've used up over 75% of your quota!"`
   - below 75%: no message.
'''
starter = '''
use std::cell::RefCell;

pub trait Messenger {
    fn send(&self, msg: &str);
}

pub struct LimitTracker<'a, T: Messenger> {
    messenger: &'a T,
    value: usize,
    max: usize,
}

impl<'a, T: Messenger> LimitTracker<'a, T> {
    pub fn new(messenger: &'a T, max: usize) -> LimitTracker<'a, T> {
        LimitTracker { messenger, value: 0, max }
    }

    pub fn set_value(&mut self, value: usize) {
        self.value = value;
    }
}

struct MockMessenger {
    sent_messages: RefCell<Vec<String>>,
}

fn main() {
    let mock = MockMessenger { sent_messages: RefCell::new(vec![]) };
    let mut tracker = LimitTracker::new(&mock, 100);
    tracker.set_value(80);
    println!("{:?}", mock.sent_messages.borrow());
}
'''
hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn run(value: usize) -> Vec<String> {
        let mock = MockMessenger { sent_messages: RefCell::new(vec![]) };
        let mut tracker = LimitTracker::new(&mock, 100);
        tracker.set_value(value);
        let sent = mock.sent_messages.borrow().clone();
        sent
    }

    #[test]
    fn quiet_below_75() {
        assert!(run(10).is_empty());
        assert!(run(74).is_empty());
    }

    #[test]
    fn warnings() {
        assert_eq!(run(80), vec!["Warning: You've used up over 75% of your quota!"]);
        assert_eq!(run(95), vec!["Urgent warning: You've used up over 90% of your quota!"]);
        assert_eq!(run(150), vec!["Error: You are over your quota!"]);
    }

    #[test]
    fn records_every_call() {
        let mock = MockMessenger { sent_messages: RefCell::new(vec![]) };
        let mut tracker = LimitTracker::new(&mock, 10);
        tracker.set_value(8);
        tracker.set_value(9);
        tracker.set_value(10);
        assert_eq!(mock.sent_messages.borrow().len(), 3);
    }
}

hints = [
  "`enum Expr { Num(i64), Var(String), Add(Box<Expr>, Box<Expr>), Mul(Box<Expr>, Box<Expr>), Neg(Box<Expr>) }`",
  "In `eval`, `match expr` and recurse: `Expr::Add(l, r) => Ok(eval(l, env)? + eval(r, env)?)`.",
  "For a variable: `env.borrow().get(name).copied().ok_or(format!(\"unknown variable: {name}\"))`.",
  "`Calculator::new` stores `Rc::clone(env)`; `set` does `self.env.borrow_mut().insert(...)`.",
]
solution = '''
use std::cell::RefCell;
use std::collections::HashMap;
use std::rc::Rc;

type Env = Rc<RefCell<HashMap<String, i64>>>;

enum Expr {
    Num(i64),
    Var(String),
    Add(Box<Expr>, Box<Expr>),
    Mul(Box<Expr>, Box<Expr>),
    Neg(Box<Expr>),
}

fn eval(expr: &Expr, env: &Env) -> Result<i64, String> {
    match expr {
        Expr::Num(n) => Ok(*n),
        Expr::Var(name) => env
            .borrow()
            .get(name)
            .copied()
            .ok_or(format!("unknown variable: {name}")),
        Expr::Add(l, r) => Ok(eval(l, env)? + eval(r, env)?),
        Expr::Mul(l, r) => Ok(eval(l, env)? * eval(r, env)?),
        Expr::Neg(e) => Ok(-eval(e, env)?),
    }
}

struct Calculator {
    env: Env,
}

impl Calculator {
    fn new(env: &Env) -> Calculator {
        Calculator { env: Rc::clone(env) }
    }

    fn set(&self, name: &str, value: i64) {
        self.env.borrow_mut().insert(name.to_string(), value);
    }

    fn run(&self, expr: &Expr) -> Result<i64, String> {
        eval(expr, &self.env)
    }
}

fn main() {
    let env: Env = Rc::new(RefCell::new(HashMap::new()));
    let a = Calculator::new(&env);
    let b = Calculator::new(&env);
    a.set("x", 4);
    // (x + 3) * -2
    let expr = Expr::Mul(
        Box::new(Expr::Add(Box::new(Expr::Var(String::from("x"))), Box::new(Expr::Num(3)))),
        Box::new(Expr::Neg(Box::new(Expr::Num(2)))),
    );
    println!("{:?}", b.run(&expr));
}
'''

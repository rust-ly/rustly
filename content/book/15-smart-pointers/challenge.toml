id = "book.smart-pointers.challenge"
kind = "challenge"
title = "A calculator with shared variables"
prompt = '''
Build a tiny expression evaluator:

1. `Expr` is a **recursive** enum, so its sub-expressions are boxed:
   `Num(i64)`, `Var(String)`, `Add(Box<Expr>, Box<Expr>)`, `Mul(Box<Expr>, Box<Expr>)`
   and `Neg(Box<Expr>)`.
2. `Env` holds variable values. It's shared between several calculators, and any of
   them can change it, so it's an `Rc<RefCell<HashMap<String, i64>>>`.
3. `eval(expr: &Expr, env: &Env) -> Result<i64, String>` evaluates the expression.
   An unknown variable is `Err("unknown variable: NAME")`.
4. `Calculator::new(env: &Env)` keeps a shared handle to the environment.
   `Calculator::set(&self, name: &str, value: i64)` stores a variable (visible to every
   calculator sharing the env), and `Calculator::run(&self, expr: &Expr)` calls `eval`.
'''

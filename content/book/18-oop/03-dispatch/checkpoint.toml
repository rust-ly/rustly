solution = '''
trait Shape {
    fn area(&self) -> f64;
}

struct Square(f64);
struct Circle(f64);

impl Shape for Square {
    fn area(&self) -> f64 {
        self.0 * self.0
    }
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        3.0 * self.0 * self.0
    }
}

fn largest_area<T: Shape>(shapes: &[T]) -> f64 {
    shapes.iter().map(|s| s.area()).fold(0.0, f64::max)
}

fn make_shape(kind: &str, size: f64) -> Option<Box<dyn Shape>> {
    match kind {
        "square" => Some(Box::new(Square(size))),
        "circle" => Some(Box::new(Circle(size))),
        _ => None,
    }
}

fn total_area(shapes: &[Box<dyn Shape>]) -> f64 {
    shapes.iter().map(|s| s.area()).sum()
}

fn main() {
    println!("{}", largest_area(&[Square(1.0), Square(3.0)]));
    let shapes: Vec<Box<dyn Shape>> = vec![
        make_shape("square", 2.0).unwrap(),
        make_shape("circle", 1.0).unwrap(),
    ];
    println!("{}", total_area(&shapes));
}
'''

hints = [
  "Add `fn name(&self) -> String;` to the trait, then one `impl Shape for ...` block per struct.",
  "`shapes.iter().map(|s| s.area()).sum()` adds up the areas, and `shapes.iter().max_by_key(|s| s.area()).map(|s| s.name())` finds the biggest.",
  "`Parcel` only needs a `new` that returns `Packing { items: Vec::new() }`. Make `Parcel` an empty struct: `struct Parcel;`.",
  "Each step takes `self` and returns the next type, moving the items along: `fn seal(self) -> Sealed { Sealed { items: self.items } }`.",
]
solution = '''
trait Shape {
    fn area(&self) -> u32;
    fn name(&self) -> String;
}

struct Rect {
    w: u32,
    h: u32,
}

struct Square {
    side: u32,
}

impl Shape for Rect {
    fn area(&self) -> u32 {
        self.w * self.h
    }

    fn name(&self) -> String {
        "rect".to_string()
    }
}

impl Shape for Square {
    fn area(&self) -> u32 {
        self.side * self.side
    }

    fn name(&self) -> String {
        "square".to_string()
    }
}

fn total_area(shapes: &[Box<dyn Shape>]) -> u32 {
    shapes.iter().map(|s| s.area()).sum()
}

fn biggest(shapes: &[Box<dyn Shape>]) -> Option<String> {
    shapes.iter().max_by_key(|s| s.area()).map(|s| s.name())
}

struct Parcel;

struct Packing {
    items: Vec<String>,
}

struct Sealed {
    items: Vec<String>,
}

struct Sent {
    items: Vec<String>,
    tracking: String,
}

impl Parcel {
    fn new() -> Packing {
        Packing { items: Vec::new() }
    }
}

impl Packing {
    fn add(mut self, item: &str) -> Packing {
        self.items.push(item.to_string());
        self
    }

    fn seal(self) -> Sealed {
        Sealed { items: self.items }
    }
}

impl Sealed {
    fn send(self, tracking: &str) -> Sent {
        Sent {
            items: self.items,
            tracking: tracking.to_string(),
        }
    }
}

impl Sent {
    fn items(&self) -> &[String] {
        &self.items
    }

    fn tracking(&self) -> &str {
        &self.tracking
    }
}

fn main() {
    let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Rect { w: 2, h: 3 }), Box::new(Square { side: 4 })];
    println!("total {}, biggest {:?}", total_area(&shapes), biggest(&shapes));

    let parcel = Parcel::new().add("tea").add("honey").seal().send("KE123");
    println!("{:?} via {}", parcel.items(), parcel.tracking());
}
'''

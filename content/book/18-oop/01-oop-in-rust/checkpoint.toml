id = "book.oop.oop-in-rust.checkpoint"
kind = "checkpoint"
title = "A collection that can't get out of sync"
prompt = '''
Finish `AveragedCollection`. Its fields stay **private**; the public methods keep
`average` correct at all times:

- `new()`, `add(value)` and `average()` as in the lesson. The average of an empty
  collection is `0.0`.
- `remove(&mut self) -> Option<i32>`: removes and returns the last value, updating the
  average.
- `len(&self) -> usize`.

Make sure removing the last value doesn't divide by zero.
'''
starter = '''
pub struct AveragedCollection {
    list: Vec<i32>,
    average: f64,
}

impl AveragedCollection {
    pub fn new() -> AveragedCollection {
        AveragedCollection { list: vec![], average: 0.0 }
    }

    pub fn add(&mut self, value: i32) {
        self.list.push(value);
    }

    pub fn average(&self) -> f64 {
        self.average
    }
}

fn main() {
    let mut c = AveragedCollection::new();
    c.add(3);
    c.add(5);
    println!("average {}, removed {:?}, now {}", c.average(), c.remove(), c.average());
}
'''

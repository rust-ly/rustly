hints = [
  "Add a private `fn update_average(&mut self)` and call it from both `add` and `remove`.",
  "In `update_average`, set the average to `0.0` when the list is empty instead of dividing.",
  "`remove`: `let value = self.list.pop(); self.update_average(); value`",
]
solution = '''
pub struct AveragedCollection {
    list: Vec<i32>,
    average: f64,
}

impl AveragedCollection {
    pub fn new() -> AveragedCollection {
        AveragedCollection { list: vec![], average: 0.0 }
    }

    pub fn add(&mut self, value: i32) {
        self.list.push(value);
        self.update_average();
    }

    pub fn remove(&mut self) -> Option<i32> {
        let value = self.list.pop();
        self.update_average();
        value
    }

    pub fn average(&self) -> f64 {
        self.average
    }

    pub fn len(&self) -> usize {
        self.list.len()
    }

    fn update_average(&mut self) {
        if self.list.is_empty() {
            self.average = 0.0;
        } else {
            let total: i32 = self.list.iter().sum();
            self.average = total as f64 / self.list.len() as f64;
        }
    }
}

fn main() {
    let mut c = AveragedCollection::new();
    c.add(3);
    c.add(5);
    println!("average {}, removed {:?}, now {}", c.average(), c.remove(), c.average());
}
'''

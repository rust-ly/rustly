id = "book.oop.trait-objects.checkpoint"
kind = "checkpoint"
title = "A screen of components"
prompt = '''
Implement `Draw` for `Label` (draws as its text) and `Checkbox` (draws as `"[x] TEXT"`
when checked, `"[ ] TEXT"` when not). Then finish `Screen`:

- `Screen::new()` starts with no components.
- `add(&mut self, c: Box<dyn Draw>)` adds a component.
- `render(&self) -> Vec<String>`: every component's `draw()`, in order.
'''
starter = '''
pub trait Draw {
    fn draw(&self) -> String;
}

pub struct Label {
    pub text: String,
}

pub struct Checkbox {
    pub text: String,
    pub checked: bool,
}

pub struct Screen {
    components: Vec<Box<dyn Draw>>,
}

fn main() {
    let mut screen = Screen::new();
    screen.add(Box::new(Label { text: String::from("Settings") }));
    screen.add(Box::new(Checkbox { text: String::from("Dark mode"), checked: true }));
    for line in screen.render() {
        println!("{line}");
    }
}

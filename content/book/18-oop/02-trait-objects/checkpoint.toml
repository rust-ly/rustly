solution = '''
pub trait Draw {
    fn draw(&self) -> String;
}

pub struct Label {
    pub text: String,
}

pub struct Checkbox {
    pub text: String,
    pub checked: bool,
}

impl Draw for Label {
    fn draw(&self) -> String {
        self.text.clone()
    }
}

impl Draw for Checkbox {
    fn draw(&self) -> String {
        let mark = if self.checked { "x" } else { " " };
        format!("[{mark}] {}", self.text)
    }
}

pub struct Screen {
    components: Vec<Box<dyn Draw>>,
}

impl Screen {
    pub fn new() -> Screen {
        Screen { components: Vec::new() }
    }

    pub fn add(&mut self, c: Box<dyn Draw>) {
        self.components.push(c);
    }

    pub fn render(&self) -> Vec<String> {
        self.components.iter().map(|c| c.draw()).collect()
    }
}

fn main() {
    let mut screen = Screen::new();
    screen.add(Box::new(Label { text: String::from("Settings") }));
    screen.add(Box::new(Checkbox { text: String::from("Dark mode"), checked: true }));
    for line in screen.render() {
        println!("{line}");
    }
}
'''

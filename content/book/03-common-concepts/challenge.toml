    }
}
'''
hints = [
  "Keep two variables, `a` and `b`, for the last two numbers. Start them at 0 and 1.",
  "Each time around the loop, the next pair is `(b, a + b)`.",
  "Loop `n` times with `for _ in 0..n`, then return `a`.",
]
solution = '''
/// Returns the nth Fibonacci number: fibonacci(0) == 0, fibonacci(1) == 1.
fn fibonacci(n: u32) -> u64 {
    let (mut a, mut b) = (0u64, 1u64);
    for _ in 0..n {
        let next = a + b;
        a = b;
        b = next;
    }
    a
}

fn main() {
    for n in 0..10 {
        println!("fibonacci({n}) = {}", fibonacci(n));
    }
}
'''

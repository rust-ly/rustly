hints = [
  "Split on `'.'` and collect into a `Vec<&str>`; it must have exactly 3 parts, each parsed with `.parse::<u32>()`.",
  "`impl fmt::Display for Version { fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, \"{}.{}.{}\", self.major, self.minor, self.patch) } }`",
  "Because `Version` derives `Ord`, `available.iter().filter(...).max()` finds the highest.",
]
solution = '''
use std::fmt;

#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
struct Version {
    major: u32,
    minor: u32,
    patch: u32,
}

impl Version {
    /// Parses a `MAJOR.MINOR.PATCH` version string.
    ///
    /// # Examples
    ///
    /// ```
    /// let v = Version::parse("1.4.2").unwrap();
    /// assert_eq!(v.to_string(), "1.4.2");
    /// ```
    ///
    /// # Errors
    ///
    /// Returns an error if there aren't exactly three numeric parts.
    fn parse(s: &str) -> Result<Version, String> {
        let err = || format!("invalid version: {s}");
        let parts: Vec<&str> = s.split('.').collect();
        if parts.len() != 3 {
            return Err(err());
        }
        let major = parts[0].parse().map_err(|_| err())?;
        let minor = parts[1].parse().map_err(|_| err())?;
        let patch = parts[2].parse().map_err(|_| err())?;
        Ok(Version { major, minor, patch })
    }

    fn is_breaking_update(&self, newer: &Version) -> bool {
        if self.major != newer.major {
            return true;
        }
        self.major == 0 && self.minor != newer.minor
    }

    fn latest_compatible(&self, available: &[Version]) -> Option<Version> {
        available
            .iter()
            .filter(|v| *v >= self && !self.is_breaking_update(v))
            .max()
            .copied()
    }
}

impl fmt::Display for Version {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "{}.{}.{}", self.major, self.minor, self.patch)
    }
}

fn main() {
    let v = Version::parse("1.4.2").unwrap();
    println!("{v}");
    println!("{:?}", Version::parse("1.x.2"));
}
'''

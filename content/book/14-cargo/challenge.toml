id = "book.cargo.challenge"
kind = "challenge"
title = "A documented Version type"
prompt = '''
Build a small, well-documented `Version` type, the kind you might publish as a crate:

1. `Version::parse(s: &str) -> Result<Version, String>` reads `"MAJOR.MINOR.PATCH"`.
   Anything else (wrong number of parts, or a part that isn't a number) returns
   `Err("invalid version: S")`, with the original text.
2. `Version` implements `std::fmt::Display` so `format!("{v}")` gives `"1.4.2"`.
3. `is_breaking_update(&self, newer: &Version) -> bool`: true when upgrading from
   `self` to `newer` might break code under SemVer: a different major version, or,
   for `0.x` versions, a different minor version.
4. `latest_compatible(&self, available: &[Version]) -> Option<Version>`: the highest
   version in `available` that is at least `self` and **not** a breaking update.

Add a `///` doc comment to `parse` with an example. (The grader can't read comments,
but it's good practice!)
'''

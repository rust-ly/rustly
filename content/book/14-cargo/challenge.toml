hidden_tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn v(s: &str) -> Version {
        Version::parse(s).unwrap()
    }

    #[test]
    fn parses() {
        assert_eq!(v("1.4.2"), Version { major: 1, minor: 4, patch: 2 });
        assert_eq!(Version::parse("1.4"), Err(String::from("invalid version: 1.4")));
        assert_eq!(Version::parse("1.x.2"), Err(String::from("invalid version: 1.x.2")));
        assert_eq!(Version::parse("1.2.3.4"), Err(String::from("invalid version: 1.2.3.4")));
    }

    #[test]
    fn displays() {
        assert_eq!(format!("{}", v("10.0.7")), "10.0.7");
    }

    #[test]
    fn breaking_updates() {
        assert!(!v("1.4.2").is_breaking_update(&v("1.9.0")));
        assert!(v("1.4.2").is_breaking_update(&v("2.0.0")));
        assert!(v("0.8.5").is_breaking_update(&v("0.9.0")));
        assert!(!v("0.8.5").is_breaking_update(&v("0.8.9")));
    }

    #[test]
    fn picks_latest_compatible() {
        let available = [v("1.3.0"), v("1.4.5"), v("1.9.1"), v("2.0.0")];
        assert_eq!(v("1.4.2").latest_compatible(&available), Some(v("1.9.1")));
        assert_eq!(v("2.1.0").latest_compatible(&available), None);
        let zero = [v("0.8.1"), v("0.8.7"), v("0.9.0")];
        assert_eq!(v("0.8.5").latest_compatible(&zero), Some(v("0.8.7")));
    }
}

hints = [
  "`initials`: `name.split_whitespace().map(|w| w.chars().next().unwrap().to_ascii_uppercase()).collect()`",
  "`truncate`: check `max < 3` first and panic. If `text.chars().count() <= max`, return it unchanged.",
  "Otherwise take `max - 3` characters with `text.chars().take(max - 3).collect::<String>()` and add `...`.",
]
solution = '''
/// Returns the first letter of each word in `name`, in upper case.
///
/// Words are separated by whitespace. An empty name gives an empty string.
///
/// # Examples
///
/// ```
/// assert_eq!(initials("ada lovelace"), "AL");
/// assert_eq!(initials("  Grace  Hopper "), "GH");
/// assert_eq!(initials(""), "");
/// ```
pub fn initials(name: &str) -> String {
    name.split_whitespace()
        .map(|w| w.chars().next().unwrap().to_ascii_uppercase())
        .collect()
}

/// Shortens `text` to at most `max` characters, ending with `...` when it was cut.
///
/// The `...` counts towards `max`. Text that already fits is returned unchanged.
///
/// # Examples
///
/// ```
/// assert_eq!(truncate("Hello, world", 8), "Hello...");
/// assert_eq!(truncate("short", 10), "short");
/// ```
///
/// # Panics
///
/// Panics if `max` is less than 3, because there's no room for the `...`.
pub fn truncate(text: &str, max: usize) -> String {
    if max < 3 {
        panic!("max must be at least 3, got {max}");
    }
    if text.chars().count() <= max {
        return text.to_string();
    }
    let kept: String = text.chars().take(max - 3).collect();
    format!("{kept}...")
}

fn main() {
    println!("{}", initials("ada lovelace"));
    println!("{}", truncate("Hello, world", 8));
}
'''

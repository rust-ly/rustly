id = "book.cargo.publishing-workspaces.checkpoint"
kind = "checkpoint"
title = "Does this update break me?"
prompt = '''
Versions are given as `(major, minor, patch)` tuples. Write:

- `bump(v: (u32, u32, u32), kind: &str) -> (u32, u32, u32)` for `"major"`, `"minor"`
  or `"patch"`. Bumping a part resets the parts after it to 0:
  `bump((1, 4, 2), "minor")` is `(1, 5, 0)`. Any other `kind` returns `v` unchanged.
- `caret_allows(req: (u32, u32, u32), v: (u32, u32, u32)) -> bool`: whether Cargo's
  `^req` accepts `v`. `v` must be at least `req`, and:
  - if `req.0 > 0`: same major version;
  - if `req.0 == 0`: same major **and** minor version.

(Tuples compare part by part, so `v >= req` works directly.)
'''

hints = [
  "`match kind { \"major\" => (v.0 + 1, 0, 0), \"minor\" => (v.0, v.1 + 1, 0), \"patch\" => (v.0, v.1, v.2 + 1), _ => v }`",
  "`if v < req { return false; }` then compare the major (and, for 0.x, the minor) parts.",
]
solution = '''
fn bump(v: (u32, u32, u32), kind: &str) -> (u32, u32, u32) {
    match kind {
        "major" => (v.0 + 1, 0, 0),
        "minor" => (v.0, v.1 + 1, 0),
        "patch" => (v.0, v.1, v.2 + 1),
        _ => v,
    }
}

fn caret_allows(req: (u32, u32, u32), v: (u32, u32, u32)) -> bool {
    if v < req {
        return false;
    }
    if req.0 > 0 {
        v.0 == req.0
    } else {
        v.0 == 0 && v.1 == req.1
    }
}

fn main() {
    println!("{:?}", bump((1, 4, 2), "minor"));
    println!("{}", caret_allows((1, 4, 2), (1, 9, 0)));
    println!("{}", caret_allows((0, 8, 5), (0, 9, 0)));
}
'''

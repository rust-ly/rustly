[workspace]
members = ["crates/*", "frontend"]
# Keep the WASM app out of the root build that Vercel runs for the API.
default-members = [".", "crates/*"]
resolver = "2"

[package]
name = "rustly-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
vercel_runtime = "2.4"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "crates/shared" }
runner = { path = "crates/runner" }

[[bin]]
name = "check"
path = "api/check.rs"

[[bin]]
name = "run"
path = "api/run.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
